<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Regional footprint</title>
  <script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" crossorigin="anonymous"></script>
  <style>
    html,body { margin:0; min-height:100%; background:#061530; color:#eef3f9; font-family:Poppins,Arial,sans-serif; }
    #wrap { position:relative; width:100%; min-height:400px; }
    svg { display:block; width:100%; height:auto; min-height:400px; }
    .land { fill:#0a2140; stroke:#1c3f6b; stroke-width:.8; }
    .neighbour { fill:#081b34; stroke:#163454; stroke-width:.6; }
    .bubble { fill:#ec6d25; fill-opacity:.76; stroke:#ffb378; stroke-width:1; }
    .label { fill:#eef3f9; font-size:11px; font-weight:700; }
    .detail { fill:#8baeca; font-size:10px; }
    #tip { position:fixed; z-index:2; pointer-events:none; opacity:0; padding:8px 10px; border:1px solid #1c3f6b; border-radius:8px; color:#c9d7e6; background:#071b31; box-shadow:0 6px 18px rgba(0,0,0,.5); font-size:11px; line-height:1.45; white-space:nowrap; }
    #tip b { color:#ffad4d; }
    #legend { position:absolute; left:14px; bottom:12px; color:#7ea1c9; font-size:10px; }
    #empty { display:none; position:absolute; inset:0; place-items:center; color:#8baeca; font-size:12px; }
  </style>
</head>
<body>
  <div id="wrap"><svg id="map" role="img" aria-label="South African regional attendance footprint"></svg><div id="tip"></div><div id="legend">Circle area = scheduled visits. Labels show attendance rate.</div><div id="empty">Regional coverage will appear after the latest Call Cycle data loads.</div></div>
  <script>
    const REGION_POINTS = {
      GAUTENG:[28.10,-26.20,'right'], KWAZULU_NATAL:[30.90,-29.20,'right'], WESTERN_CAPE:[19.00,-33.60,'left'], MPUMALANGA:[30.60,-25.60,'right'], FREE_STATE:[26.80,-28.80,'left'], EAST_LONDON:[27.90,-32.90,'right'], LIMPOPO:[29.50,-23.60,'right'], PORT_ELIZABETH:[25.60,-33.90,'right'], NORTH_WEST:[25.60,-26.10,'left'], SWD:[22.30,-33.70,'left']
    };
    const normalise = (value) => String(value || '').toUpperCase().replace(/[^A-Z]/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
    const number = (value) => Number(value || 0).toLocaleString('en-ZA');
    let mapData = [];
    let topology = null;
    let drawTimer = null;

    async function loadTopology() {
      if (topology) return topology;
      const response = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json');
      topology = await response.json();
      return topology;
    }

    async function draw() {
      const empty = document.getElementById('empty');
      empty.style.display = mapData.length ? 'none' : 'grid';
      if (!window.d3 || !window.topojson) return;
      const raw = await loadTopology();
      const svg = d3.select('#map');
      const node = svg.node();
      const width = Math.max(node.clientWidth || 900, 480);
      const height = Math.max(Math.round(width * .55), 400);
      svg.attr('viewBox', `0 0 ${width} ${height}`).selectAll('*').remove();
      const countries = topojson.feature(raw, raw.objects.countries).features;
      const southAfrica = countries.filter((feature) => String(feature.id) === '710');
      const neighbours = countries.filter((feature) => ['426','516','748','072','716','508','024'].includes(String(feature.id)));
      const projection = d3.geoMercator().fitExtent([[30,20],[width - 30,height - 24]], { type:'FeatureCollection', features:southAfrica });
      const path = d3.geoPath(projection);
      svg.append('g').selectAll('path').data(neighbours).join('path').attr('class','neighbour').attr('d',path);
      svg.append('g').selectAll('path').data(southAfrica).join('path').attr('class','land').attr('d',path);
      const visible = mapData.filter((row) => REGION_POINTS[normalise(row.region)]);
      const scale = d3.scaleSqrt().domain([0,d3.max(visible,(row) => row.scheduled) || 1]).range([5,32]);
      const tip = d3.select('#tip');
      const points = svg.append('g').selectAll('g').data(visible).join('g').attr('transform',(row) => {
        const point = REGION_POINTS[normalise(row.region)];
        const position = projection([point[0],point[1]]);
        return `translate(${position[0]},${position[1]})`;
      });
      points.append('circle').attr('class','bubble').attr('r',(row) => scale(row.scheduled)).on('mousemove',(event,row) => {
        tip.style('opacity',1).style('left',`${event.clientX + 14}px`).style('top',`${event.clientY - 12}px`).html(`<b>${row.region}</b><br>${number(row.scheduled)} scheduled visits<br>${number(row.onSchedule)} on schedule (${Number(row.strikeRate || 0).toFixed(1)}%)<br>${number(row.stores)} stores covered`);
      }).on('mouseleave',() => tip.style('opacity',0));
      const labels = points.append('g').attr('transform',(row) => {
        const point = REGION_POINTS[normalise(row.region)];
        const offset = scale(row.scheduled) + 8;
        return `translate(${point[2] === 'left' ? -offset : offset},0)`;
      }).attr('text-anchor',(row) => REGION_POINTS[normalise(row.region)][2] === 'left' ? 'end' : 'start');
      labels.append('text').attr('class','label').attr('dy','-.15em').text((row) => row.region);
      labels.append('text').attr('class','detail').attr('dy','1.2em').text((row) => `${number(row.scheduled)} visits · ${Number(row.strikeRate || 0).toFixed(1)}% on schedule`);
    }

    function scheduleDraw() { window.clearTimeout(drawTimer); drawTimer = window.setTimeout(() => draw().catch(() => {}), 30); }
    window.addEventListener('message',(event) => {
      if (event.origin !== window.location.origin || event.data?.type !== 'nexus-call-cycle-region-data') return;
      mapData = Array.isArray(event.data.payload?.regions) ? event.data.payload.regions : [];
      scheduleDraw();
    });
    window.addEventListener('resize',scheduleDraw);
    scheduleDraw();
  </script>
</body>
</html>
