    const chLineMeasure = S.chLineMeasure || (isVal ? "value" : "volume");
    const lineIsVal = chLineMeasure === "value";
    const chLineKey = lineIsVal ? "sales_value" : "sales_units";
    const chFmt = lineIsVal ? (v) => this.cur(v) : (v) => this.num(v);
    const chLineOpts = [{ key: "value", label: "Value" }, { key: "volume", label: "Volume" }].map(o => ({
      label: o.label, on: chLineMeasure === o.key, pick: () => this.setState({ chLineMeasure: o.key })
    }));
    const chWin12 = rCurMonths;
    const chTopNames = (S.chPick ? [S.chPick] : rRowsAll.slice().sort((a, z) => z.cur_value - a.cur_value).slice(0, 6).map(r => r.dim));
    const byRet = Object.keys(bnMonthly).length ? bnMonthly : (function () {
      const m = {};
      d.price_mix.by_retailer.forEach(r => {
        const key = String(r.banner).toUpperCase();
        (m[key] || (m[key] = {}))[r.month] = r;
      });
      return m;
    })();
    const chSeries = chTopNames.map((name, i) => {
      const rows = byRet[String(name).toUpperCase()] || {};
      return {
        name: this.title(name), color: CH_COLORS[i % CH_COLORS.length],
        pts: chWin12.map(m => (rows[m] ? rows[m][chLineKey] : 0))
      };
    });
    const chHi = Math.max(...chSeries.reduce((a, s) => a.concat(s.pts), [0]), 1);
    const CW = 620, CH2 = 210;
    const cY = (v) => CH2 - 8 - (v / chHi) * (CH2 - 24);
    const cX = (i) => chWin12.length < 2 ? 0 : (i / (chWin12.length - 1)) * CW;
    const channelLines = chSeries.map(s => ({
      name: s.name, color: s.color,
      path: s.pts.map((v, j) => (j ? "L" : "M") + cX(j).toFixed(1) + " " + cY(v).toFixed(1)).join(" ")
    }));
    const channelGrid = [];
    for (let i = 5; i >= 0; i--) { const v = (i / 5) * chHi; channelGrid.push({ y: cY(v).toFixed(1), label: chFmt(v) }); }
    const channelTicks = chWin12.map(m => this.mon(m, true));
    const channelHovers = chWin12.map((m, j) => ({
      label: this.mon(m, true),
      pts: chSeries.map(s => ({ name: s.name, color: s.color, val: chFmt(s.pts[j]) }))
    }));
    const channelLineTitle = "Monthly " + (lineIsVal ? "value" : "volume") + " by retailer"
      + (S.chPick ? " — " + this.title(S.chPick) : " — top " + chSeries.length);

    /* contribution waterfall + this-year-vs-last bars */
    const chMetric = S.chMetric || "value";
    const isChVal = chMetric === "value";
    const dKey = isChVal ? "delta_value" : "delta_units";
    const curKey = isChVal ? "cur_value" : "cur_units";
    const lyKey = isChVal ? "ly_value" : "ly_units";
    const vsKey = isChVal ? "value_vs_pct" : "units_vs_pct";
    const chFmt2 = isChVal ? (v) => this.cur(v) : (v) => this.num(v);
    const wfTop = rRowsAll.slice().sort((a, z) => Math.abs(z[dKey]) - Math.abs(a[dKey])).slice(0, 9)
      .sort((a, z) => z[dKey] - a[dKey]);
    const wfNet = rRowsAll.reduce((a, r) => a + r[dKey], 0);
    let run = 0;
    const steps = wfTop.map(r => {
      const from = run; run += r[dKey];
      return { name: this.title(r.dim), dim: r.dim, from, to: run, delta: r[dKey], net: false };
    });
    steps.push({ name: "All retailers", from: 0, to: wfNet, delta: wfNet, net: true });
    const wLo = Math.min(0, ...steps.map(s => Math.min(s.from, s.to)));
    const wHi = Math.max(0, ...steps.map(s => Math.max(s.from, s.to)));
    const WW = 620, WH = 210, span = (wHi - wLo) || 1;
    const wY = (v) => WH - 8 - ((v - wLo) / span) * (WH - 26);
    const slotW = WW / steps.length, barW = Math.min(46, slotW * 0.56);
    const waterfallGrid = [];
    for (let i = 0; i <= 4; i++) {
      const v = wLo + (span * i) / 4;
      waterfallGrid.push({ y: wY(v).toFixed(1), label: chFmt2(v) });
    }
    waterfallGrid.reverse();
    const waterfall = steps.map((s, i) => {
      const y1 = wY(s.from), y2 = wY(s.to);
      const top = Math.min(y1, y2), h = Math.max(2, Math.abs(y2 - y1));
      return {
        name: s.name, label: (s.delta >= 0 ? "+" : "−") + chFmt2(Math.abs(s.delta)).replace("−", ""),
        x: (i * slotW + (slotW - barW) / 2).toFixed(1), w: barW.toFixed(1),
        y: top.toFixed(1), h: h.toFixed(1),
        cx: (i * slotW + slotW / 2).toFixed(1),
        labelY: (top - 5).toFixed(1),
        pctX: ((i * slotW + slotW / 2) / WW * 100).toFixed(2) + "%",
        pctY: (top / WH * 100).toFixed(2) + "%",
        fill: s.net ? "#1E3A52" : s.delta >= 0 ? "#22C55E" : "#D94F3A",
        stroke: s.net ? "#5B9BD5" : "none",
        color: s.net ? "#f3f7fc" : s.delta >= 0 ? "#22C55E" : "#D94F3A",
        cursor: s.net ? "default" : "pointer",
        pick: s.net ? (() => {}) : (() => this.setState({ chPick: S.chPick === s.dim ? null : s.dim }))
      };
    });
    const waterfallZero = wY(0).toFixed(1);
    const waterfallTitle = "What moved the " + (isChVal ? "value" : "volume") + " — retailer contribution";
    const chMetricOpts = [{ key: "value", label: "Value" }, { key: "volume", label: "Volume" }].map(o => ({
      label: o.label, on: chMetric === o.key, pick: () => this.setState({ chMetric: o.key })
    }));

    const pairTop = rRowsAll.slice().sort((a, z) => z[curKey] - a[curKey]).slice(0, 8);
    const pairMax = Math.max(...pairTop.map(r => Math.max(r[curKey], r[lyKey])), 1);
    const pairRows = pairTop.map(r => ({
      name: this.title(r.dim),
      curW: (r[curKey] / pairMax * 100).toFixed(1) + "%", lyW: (r[lyKey] / pairMax * 100).toFixed(1) + "%",
      cur: chFmt2(r[curKey]), vs: this.pct(r[vsKey]), vsColor: this.tone(r[vsKey])
    }));
    const pairTitle = "Top retailers — " + (isChVal ? "value" : "volume") + ", this year vs last";

    const chLead = rRowsAll.slice().sort((a, z) => z.cur_value - a.cur_value)[0] || {};
    const chGain = rRowsAll.slice().sort((a, z) => z.delta_value - a.delta_value)[0] || {};
    const chDrop = rRowsAll.slice().sort((a, z) => a.delta_value - z.delta_value)[0] || {};
    const channelCards = [
      {
        kicker: "Largest retailer", iconColor: "#ec6d25", iconBg: "rgba(236,109,37,.12)", iconBorder: "rgba(236,109,37,.4)",
        icon: "M3 9h18l-1.5-5h-15L3 9ZM5 9v11h14V9",
        body: chLead ? this.title(chLead.dim) + " accounts for " + (chLead.cur_value / rTotCur * 100).toFixed(1) + "% of retailer value at " + this.cur(chLead.cur_value) + ", " + this.pct(chLead.value_vs_pct) + " on last year." : "—"
      },
      {
        kicker: "Biggest gain", iconColor: "#22C55E", iconBg: "rgba(34,197,94,.12)", iconBorder: "rgba(34,197,94,.35)",
        icon: "M7 17 17 7M17 7h-6M17 7v6",
        body: chGain ? this.title(chGain.dim) + " added " + this.cur(chGain.delta_value) + " (" + this.pct(chGain.value_vs_pct) + ") year on year." : "—"
      },
      {
        kicker: "Biggest decline", iconColor: "#D94F3A", iconBg: "rgba(217,79,58,.12)", iconBorder: "rgba(217,79,58,.4)",
        icon: "M7 7 17 17M17 17h-6M17 17v-6",
        body: chDrop ? this.title(chDrop.dim) + " declined " + this.cur(Math.abs(chDrop.delta_value)) + " (" + this.pct(chDrop.value_vs_pct) + ")." : "—"
      }
    ];

    /* ---------------- Products page ---------------- */
    const pWinN = rollN || 12;
    const pEnd = monthsAll.indexOf(series[lastComplete].month);
    const pCurMonths = monthsAll.slice(Math.max(0, pEnd - pWinN + 1), pEnd + 1);
    const pLyMonths = monthsAll.slice(Math.max(0, pEnd - pWinN * 2 + 1), Math.max(0, pEnd - pWinN + 1));
    const catAgg = {};
    d.category_monthly.forEach(r => {
      const t = catAgg[r.category] || (catAgg[r.category] = { cv: 0, lv: 0, cu: 0, lu: 0, monthly: {} });
      if (pCurMonths.indexOf(r.month) > -1) { t.cv += r.sales_value; t.cu += r.sales_units; }
      else if (pLyMonths.indexOf(r.month) > -1) { t.lv += r.sales_value; t.lu += r.sales_units; }
      t.monthly[r.month] = r;
    });
    const catList = Object.keys(catAgg).map(k => Object.assign({ name: k }, catAgg[k]))
      .filter(r => r.cv > 0 || r.lv > 0);
    const catCur = catList.reduce((a, r) => a + r.cv, 0) || 1;
    const catLy = catList.reduce((a, r) => a + r.lv, 0) || 1;
    const catUnits = catList.reduce((a, r) => a + r.cu, 0) || 1;
    const catUnitsLy = catList.reduce((a, r) => a + r.lu, 0) || 1;

    const pTile = (label, value, vs, note, absDelta) => {
      const up = vs != null && vs > 0;
      return {
        label, value, note,
        delta: absDelta != null ? Math.abs(absDelta) : this.bare(vs, 1),
        arrow: absDelta != null ? (absDelta >= 0 ? "▲" : "▼") : (vs == null ? "" : up ? "▲" : "▼"),
        color: absDelta != null ? this.tone(absDelta) : this.tone(vs),
        pillBg: absDelta != null ? (absDelta >= 0 ? "rgba(34,197,94,.12)" : "rgba(217,79,58,.12)")
          : vs == null ? "rgba(91,155,213,.12)" : up ? "rgba(34,197,94,.12)" : "rgba(217,79,58,.12)"
      };
    };
    const realProducts = d.products.filter(p => p.product && String(p.product).toLowerCase() !== "nan");
    const prodTotal = realProducts.reduce((a, r) => a + r.sales_value, 0) || 1;
    const productKpis = [
      pTile("Category value", this.cur(catCur), catLy ? catCur / catLy - 1 : null, "vs prior period"),
      pTile("Category volume", this.num(catUnits), catUnitsLy ? catUnits / catUnitsLy - 1 : null, "vs prior period"),
      pTile("Categories trading", this.int(catList.filter(r => r.cv > 0).length),
        (function () { const now = catList.filter(r => r.cv > 0).length, then = catList.filter(r => r.lv > 0).length; return then ? now / then - 1 : null; })(),
        "vs prior period",
        catList.filter(r => r.cv > 0).length - catList.filter(r => r.lv > 0).length),
      pTile("Products listed", this.int(realProducts.length), null, "all-time in extract")
    ];

    /* product buckets */
    const pbWin = S.pbWin || "12m";
    const pbSfx = pbWin === "3m" ? "_3m" : "_12m";
    const pbRows0 = d.bucket_summary.slice().sort((a, z) => z["val" + pbSfx] - a["val" + pbSfx]);
    const pbValTot = pbRows0.reduce((a, r) => a + r["val" + pbSfx], 0) || 1;
    const pbVolTot = pbRows0.reduce((a, r) => a + r["vol" + pbSfx], 0) || 1;
    const PB_COLORS = ["#ec6d25", "#5B9BD5", "#22C55E", "#E8A838", "#9dc4ec", "#7d8fa8"];
    const bucketProdRows = pbRows0.map((r, i) => {
      const vShare = r["val" + pbSfx] / pbValTot, uShare = r["vol" + pbSfx] / pbVolTot;
      const vVs = r["val" + pbSfx + "_vs_pp"], uVs = r["vol" + pbSfx + "_vs_pp"];
      const pp = pbWin === "3m" ? null : r.val_12m_share_pp_change;
      return {
        name: r.bucket, fill: PB_COLORS[i % PB_COLORS.length],
        value: this.cur(r["val" + pbSfx]), units: this.num(r["vol" + pbSfx]),
        vShare: (vShare * 100).toFixed(1) + "%", uShare: (uShare * 100).toFixed(1) + "%",
        vBar: (vShare * 100).toFixed(1) + "%", uBar: (uShare * 100).toFixed(1) + "%",
        vVs: this.pct(vVs), vVsColor: this.tone(vVs), uVs: this.pct(uVs), uVsColor: this.tone(uVs),
        pp: pp == null ? "—" : (pp >= 0 ? "+" : "") + (pp * 100).toFixed(2) + "pp",
        ppColor: pp == null ? "#8DA2B5" : this.tone(pp)
      };
    });
    const pbWinOpts = [{ key: "12m", label: "Rolling 12m" }, { key: "3m", label: "Latest 3m" }].map(o => ({
      label: o.label, on: pbWin === o.key, pick: () => this.setState({ pbWin: o.key })
    }));

    /* category league table */
    const catSort = S.catSort || "val";
    const catSorters = {
      val: (a, z) => z.cv - a.cv, vol: (a, z) => z.cu - a.cu,
      gain: (a, z) => (z.cv - z.lv) - (a.cv - a.lv), drop: (a, z) => (a.cv - a.lv) - (z.cv - z.lv),
      growth: (a, z) => (z.lv ? z.cv / z.lv - 1 : -9) - (a.lv ? a.cv / a.lv - 1 : -9)
    };
    const catPick = S.catPick || "";
    let catFiltered = catList.filter(r => !catPick || r.name === catPick).slice().sort(catSorters[catSort] || catSorters.val);
    const catLimit = S.catLimit || 12;
    const catMax = Math.max(...catFiltered.slice(0, catLimit).map(r => Math.max(r.cv, r.lv)), 1);
    const categoryRows = catFiltered.slice(0, catLimit).map((r, i) => {
      const vVs = r.lv ? r.cv / r.lv - 1 : null, uVs = r.lu ? r.cu / r.lu - 1 : null;
      const pc = r.cu ? r.cv / r.cu : null, pl = r.lu ? r.lv / r.lu : null;
      const pVs = pc && pl ? pc / pl - 1 : null;
      const sharePp = r.cv / catCur - r.lv / catLy;
      const on = S.category === r.name;
      return {
        rank: i + 1, name: this.title(r.name),
        value: this.cur(r.cv), vVs: this.pct(vVs), vVsColor: this.tone(vVs),
        units: this.num(r.cu), uVs: this.pct(uVs), uVsColor: this.tone(uVs),
        price: pc ? "R" + pc.toFixed(2) : "—", pVs: this.pct(pVs), pVsColor: this.tone(pVs),
        delta: this.cur(r.cv - r.lv), deltaColor: this.tone(r.cv - r.lv),
        share: (r.cv / catCur * 100).toFixed(2) + "%",
        sharePp: (sharePp >= 0 ? "+" : "") + (sharePp * 100).toFixed(2) + "pp", sharePpColor: this.tone(sharePp),
        barCur: (r.cv / catMax * 100).toFixed(1) + "%", barLy: (r.lv / catMax * 100).toFixed(1) + "%",
        rowBg: on ? "rgba(236,109,37,.10)" : "transparent",
        pick: () => this.setState({ category: on ? "all" : r.name })
      };
    });
    const categoryCols = [
      { label: "#", align: "left", color: "#4A6B8A" }, { label: "Category", align: "left", color: "#4A6B8A" },
      { label: "Value", align: "right", color: "#ec6d25" }, { label: "vs LY", align: "right", color: "#ec6d25" },
      { label: "Volume", align: "right", color: "#5B9BD5" }, { label: "vs LY", align: "right", color: "#5B9BD5" },
      { label: "Avg price", align: "right", color: "#8DA2B5" }, { label: "vs LY", align: "right", color: "#8DA2B5" },
      { label: "Rand change", align: "right", color: "#8DA2B5" }, { label: "Share", align: "right", color: "#8DA2B5" },
      { label: "Share shift", align: "right", color: "#8DA2B5" }, { label: "This period vs last", align: "left", color: "#4A6B8A" }
    ];
    const catSortOpts = [
      { key: "val", label: "Value" }, { key: "vol", label: "Volume" },
      { key: "gain", label: "Top gain" }, { key: "drop", label: "Top drop" }, { key: "growth", label: "Growth %" }
    ].map(o => ({ label: o.label, on: catSort === o.key, pick: () => this.setState({ catSort: o.key, catLimit: 12 }) }));
    const catPickOpts = [{ key: "", label: "All categories" }].concat(
      catList.slice().sort((a, z) => z.cv - a.cv).map(r => ({ key: r.name, label: this.title(r.name) })));
    const categoryCount = "Showing " + categoryRows.length + " of " + catFiltered.length + " categories";

    /* monthly lines by category */
    const pLineMeasure = S.pLineMeasure || (isVal ? "value" : "volume");
    const pLineVal = pLineMeasure === "value";
    const pKey = pLineVal ? "sales_value" : "sales_units";
    const pFmt = pLineVal ? (v) => this.cur(v) : (v) => this.num(v);
    const pLineOpts = [{ key: "value", label: "Value" }, { key: "volume", label: "Volume" }].map(o => ({
      label: o.label, on: pLineMeasure === o.key, pick: () => this.setState({ pLineMeasure: o.key })
    }));
    const pTop = (catPick ? catList.filter(r => r.name === catPick) : catList.slice().sort((a, z) => z.cv - a.cv).slice(0, 6));
    const pSeries = pTop.map((r, i) => ({
      name: this.title(r.name), color: PB_COLORS[i % PB_COLORS.length],
      pts: pCurMonths.map(m => (r.monthly[m] ? r.monthly[m][pKey] : 0))
    }));
    const pHi = Math.max(...pSeries.reduce((a, s) => a.concat(s.pts), [0]), 1);
    const PW = 620, PH = 210;
    const pY = (v) => PH - 8 - (v / pHi) * (PH - 24);
    const pX = (i) => pCurMonths.length < 2 ? 0 : (i / (pCurMonths.length - 1)) * PW;
    const productLines = pSeries.map(s => ({
      name: s.name, color: s.color,
      path: s.pts.map((v, j) => (j ? "L" : "M") + pX(j).toFixed(1) + " " + pY(v).toFixed(1)).join(" ")
    }));
    const productGrid = [];
    for (let i = 5; i >= 0; i--) { const v = (i / 5) * pHi; productGrid.push({ y: pY(v).toFixed(1), label: pFmt(v) }); }
    const productTicks = pCurMonths.map(m => this.mon(m, true));
    const productHovers = pCurMonths.map((m, j) => ({
      label: this.mon(m, true),
      pts: pSeries.map(s => ({ name: s.name, color: s.color, val: pFmt(s.pts[j]) }))
    }));
    const productLineTitle = "Monthly " + (pLineVal ? "value" : "volume") + " by category"
      + (catPick ? " — " + this.title(catPick) : " — top " + pSeries.length);

    /* ---------------- Products page (product_detail) ---------------- */
    const PD = (d.product_detail && d.product_detail.rows) || [];
    const pdNet = (d.product_detail && d.product_detail.network_stores_latest) || null;
    const pdLatest = (d.product_detail && d.product_detail.latest_month) || latest;
    const pdRows = PD.filter(r => r.product && String(r.product).toLowerCase() !== "nan");
    const pdTotCur = pdRows.reduce((a, r) => a + (r.cur_value || 0), 0) || 1;
    const pdTotLy = pdRows.reduce((a, r) => a + (r.ly_value || 0), 0) || 1;
    const pdTotUnits = pdRows.reduce((a, r) => a + (r.cur_units || 0), 0) || 1;
    const pdTotUnitsLy = pdRows.reduce((a, r) => a + (r.ly_units || 0), 0) || 1;
    const curYearPd = parseInt(String(pdLatest).slice(0, 4), 10);
    const isNewProd = (r) => r.first_sold && parseInt(String(r.first_sold).slice(0, 4), 10) === curYearPd;
    /* quiet is measured against the last COMPLETE month, and needs two clear months —
       one missing month on a partial period is timing, not a delisting */
    const pdComplete = series[lastComplete].month;
    const quietCutoff = series[Math.max(0, lastComplete - 1)].month;
    const isQuiet = (r) => r.last_sold && String(r.last_sold).slice(0, 7) < String(quietCutoff).slice(0, 7);
    const newProds = pdRows.filter(isNewProd);
    const quietProds = pdRows.filter(isQuiet);

    const spark = (arr, color) => {
      const a = (arr || []).filter(v => v != null);
      if (a.length < 2) return { path: "", area: "", color };
      const hi = Math.max(...a), lo = Math.min(...a), sp = (hi - lo) || 1;
      const X = (i) => (i / (a.length - 1)) * 100;
      const Y = (v) => 26 - ((v - lo) / sp) * 22;
      return {
        path: a.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1)).join(" "),
        color: a[a.length - 1] >= a[0] ? "#22C55E" : "#D94F3A"
      };
    };

    const pdSort = S.pdSort || "val";
    const pdSorters = {
      val: (a, z) => (z.cur_value || 0) - (a.cur_value || 0),
      vol: (a, z) => (z.cur_units || 0) - (a.cur_units || 0),
      gain: (a, z) => ((z.cur_value || 0) - (z.ly_value || 0)) - ((a.cur_value || 0) - (a.ly_value || 0)),
      drop: (a, z) => ((a.cur_value || 0) - (a.ly_value || 0)) - ((z.cur_value || 0) - (z.ly_value || 0)),
      growth: (a, z) => (z.value_vs_pct == null ? -9 : z.value_vs_pct) - (a.value_vs_pct == null ? -9 : a.value_vs_pct),
      reach: (a, z) => (z.stores_latest || 0) - (a.stores_latest || 0)
    };
    const pdView = S.pdView || "all";
    const pdq = (S.pdq || "").trim().toLowerCase();
    const pdCat = S.pdCat || "";
    let pdFiltered = pdRows.filter(r =>
      (pdView === "all" || (pdView === "new" ? isNewProd(r) : pdView === "quiet" ? isQuiet(r) : true)) &&
      (!pdCat || r.category === pdCat) &&
      // S.product was previously accepted into the filter-context object but
      // never actually applied here (dead filter, flagged 2026-08-21) --
      // now genuinely narrows the Products page to the one selected product.
      (S.product === "all" || r.product === S.product) &&
      (!pdq || String(r.product).toLowerCase().indexOf(pdq) > -1));
    pdFiltered = pdFiltered.slice().sort(pdSorters[pdSort] || pdSorters.val);
    const pdLimit = S.pdLimit || 15;
    const pdMax = Math.max(...pdFiltered.slice(0, pdLimit).map(r => Math.max(r.cur_value || 0, r.ly_value || 0)), 1);
    const productDetailRows = pdFiltered.slice(0, pdLimit).map((r, i) => {
      const pc = r.cur_units ? r.cur_value / r.cur_units : null;
      const pl = r.ly_units ? r.ly_value / r.ly_units : null;
      const pVs = pc && pl ? pc / pl - 1 : null;
      const sp = spark(r.trend_value);
      const hasSpark = !!sp.path;
      const flags = [];
      if (isNewProd(r)) flags.push({ label: "New", color: "#22C55E", bg: "rgba(34,197,94,.14)" });
      if (isQuiet(r)) flags.push({ label: "Went quiet", color: "#E8A838", bg: "rgba(232,168,56,.14)" });
      return {
        rank: i + 1, name: this.title(r.product),
        category: r.category ? this.title(r.category) : "—",
        flags,
        value: this.cur(r.cur_value), vVs: this.pct(r.value_vs_pct), vVsColor: this.tone(r.value_vs_pct),
        units: this.num(r.cur_units), uVs: this.pct(r.units_vs_pct), uVsColor: this.tone(r.units_vs_pct),
        price: pc ? "R" + pc.toFixed(2) : "—", pVs: this.pct(pVs), pVsColor: this.tone(pVs),
        stores: r.stores_latest == null ? "—" : this.int(r.stores_latest),
        reach: r.stores_latest != null && pdNet ? (r.stores_latest / pdNet * 100).toFixed(1) + "%" : "—",
        reachBar: r.stores_latest != null && pdNet ? Math.min(100, r.stores_latest / pdNet * 100).toFixed(1) + "%" : "0%",
        share: ((r.cur_value || 0) / pdTotCur * 100).toFixed(2) + "%",
        bar: ((r.cur_value || 0) / pdMax * 100).toFixed(1) + "%",
        sparkPath: hasSpark ? sp.path : "M0 15 L100 15", sparkColor: hasSpark ? sp.color : "#2a4365",
        sparkDash: hasSpark ? "none" : "3 3",
        lastSold: r.last_sold ? this.mon(String(r.last_sold), true) : "—"
      };
    });
    const pdCols = [
      { label: "#", align: "left", color: "#4A6B8A" }, { label: "Product", align: "left", color: "#4A6B8A" },
      { label: "Category", align: "left", color: "#4A6B8A" }, { label: "12m trend", align: "left", color: "#4A6B8A" },
      { label: "12m value", align: "right", color: "#ec6d25" }, { label: "vs LY", align: "right", color: "#ec6d25" },
      { label: "12m units", align: "right", color: "#5B9BD5" }, { label: "vs LY", align: "right", color: "#5B9BD5" },
      { label: "Avg price", align: "right", color: "#8DA2B5" }, { label: "vs LY", align: "right", color: "#8DA2B5" },
      { label: "Stores", align: "right", color: "#8DA2B5" }, { label: "Reach", align: "left", color: "#8DA2B5" },
      { label: "Share", align: "right", color: "#8DA2B5" }
    ];
    const pdSortOpts = [
      { key: "val", label: "Value" }, { key: "vol", label: "Units" }, { key: "gain", label: "Top gain" },
      { key: "drop", label: "Top drop" }, { key: "growth", label: "Growth %" }, { key: "reach", label: "Reach" }
    ].map(o => ({ label: o.label, on: pdSort === o.key, pick: () => this.setState({ pdSort: o.key, pdLimit: 15 }) }));
    const pdViewOpts = [
      { key: "all", label: "All products" }, { key: "new", label: "New (" + newProds.length + ")" },
      { key: "quiet", label: "Went quiet (" + quietProds.length + ")" }
    ].map(o => ({ label: o.label, on: pdView === o.key, pick: () => this.setState({ pdView: o.key, pdLimit: 15 }) }));
    const pdCatOpts = [{ key: "", label: "All categories" }].concat(
      Array.from(new Set(pdRows.map(r => r.category).filter(Boolean))).sort()
        .map(c => ({ key: c, label: this.title(c) })));

    /* KPI sparklines — sum the per-product trend arrays */
    const trendLen = Math.max(0, ...pdRows.map(r => (r.trend_value || []).length));
    const sumTrend = (key) => {
      const out = new Array(trendLen).fill(0);
      pdRows.forEach(r => (r[key] || []).forEach((v, i) => { if (v != null) out[i] += v; }));
      return out;
    };
    const kSpark = (arr, up) => {
      const a = arr.filter(v => v != null);
      if (a.length < 2) return { path: "", color: "#4A6B8A" };
      const hi = Math.max(...a), lo = Math.min(...a), sp = (hi - lo) || 1;
      return {
        path: a.map((v, i) => (i ? "L" : "M") + ((i / (a.length - 1)) * 100).toFixed(1) + " " + (26 - ((v - lo) / sp) * 22).toFixed(1)).join(" "),
        color: up ? "#22C55E" : "#D94F3A"
      };
    };
    const valTrend = sumTrend("trend_value"), unitTrend = sumTrend("trend_units");
    const priceTrend = valTrend.map((v, i) => (unitTrend[i] ? v / unitTrend[i] : 0));
    const pdPrice = pdTotUnits ? pdTotCur / pdTotUnits : null;
    const pdPriceLy = pdTotUnitsLy ? pdTotLy / pdTotUnitsLy : null;
    const activeSkus = pdRows.filter(r => (r.cur_value || 0) > 0).length;
    const activeSkusLy = pdRows.filter(r => (r.ly_value || 0) > 0).length;
    /* value-weighted distribution: each product's reach weighted by its share of value */
    const wDist = pdNet
      ? pdRows.reduce((a, r) => a + (r.stores_latest != null ? (r.stores_latest / pdNet) * (r.cur_value || 0) : 0), 0) / pdTotCur
      : null;

    /* winners and pressure points */
    const wpMeasure = S.wpMeasure || "value";
    const wpVal = wpMeasure === "value";
    const wpFmt = wpVal ? (v) => this.cur(v) : (v) => (v >= 0 ? "+" : "−") + this.num(Math.abs(v));
    const contribRows = pdRows.map(r => ({
      name: this.title(r.product), key: r.product,
      delta: wpVal ? (r.cur_value || 0) - (r.ly_value || 0) : (r.cur_units || 0) - (r.ly_units || 0),
      vs: wpVal ? r.value_vs_pct : r.units_vs_pct
    }));
    const gainers = contribRows.slice().sort((a, z) => z.delta - a.delta).slice(0, 6);
    const draggers = contribRows.slice().sort((a, z) => a.delta - z.delta).slice(0, 6);
    const cMax = Math.max(...gainers.concat(draggers).map(r => Math.abs(r.delta)), 1);
    const shapeContrib = (rows, fill) => rows.map(r => ({
      name: r.name, delta: wpFmt(r.delta), vs: this.pct(r.vs),
      color: this.tone(r.delta), w: (Math.abs(r.delta) / cMax * 100).toFixed(1) + "%", fill,
      pick: () => this.setState({ pdQ: S.pdQ === r.name ? "" : r.name })
    }));
    const pdGainers = shapeContrib(gainers, "#22C55E");
    const pdDraggers = shapeContrib(draggers, "#D94F3A");
    const pdGainTotal = wpFmt(gainers.reduce((a, r) => a + r.delta, 0));
    const pdDragTotal = wpFmt(draggers.reduce((a, r) => a + r.delta, 0));

    /* portfolio mix by category + concentration */
    /* product_detail.category is null for most rows, so the mix is computed over
       categorised products only and the coverage is stated rather than shown as a bucket */
    const pdCategorised = pdRows.filter(r => r.category);
    const mixMeasure = S.mixMeasure || "value";
    const mixKey = mixMeasure === "volume" ? "cur_units" : "cur_value";
    const mixTotal = mixMeasure === "volume" ? pdTotUnits : pdTotCur;
    const pdCatValue = pdCategorised.reduce((a, r) => a + (r[mixKey] || 0), 0);
    const catMix = {};
    pdCategorised.forEach(r => { catMix[r.category] = (catMix[r.category] || 0) + (r[mixKey] || 0); });
    const mixSorted = Object.keys(catMix).map(k => ({ name: this.title(k), val: catMix[k] }))
      .sort((a, z) => z.val - a.val);
    const mixBase = pdCatValue || 1;
    const mixCoverage = "Categorised products cover " + (pdCatValue / mixTotal * 100).toFixed(0)
      + "% of tracked " + mixMeasure
      + " — " + this.int(pdRows.length - pdCategorised.length) + " of "
      + this.int(pdRows.length) + " products carry no category in this extract.";
    const mixTop = mixSorted.slice(0, 7);
    const mixOther = mixSorted.slice(7).reduce((a, r) => a + r.val, 0);
    /* seven distinct hues for named categories; "Other" always takes the reserved grey */
    const MIX_COLORS = ["#ec6d25", "#5B9BD5", "#22C55E", "#E8A838", "#9dc4ec", "#f2955c", "#8b6fd4"];
    const MIX_OTHER = "#546B87";
    const MC = 2 * Math.PI * 54;
    let macc = 0;
    const mixSegs = mixTop.concat(mixOther > 0 ? [{ name: "Other categories", val: mixOther }] : []).map((r, i) => {
      const frac = r.val / mixBase;
      const seg = {
        name: r.name, fill: r.name === "Other categories" ? MIX_OTHER : MIX_COLORS[i % MIX_COLORS.length],
        dash: (frac * MC).toFixed(2) + " " + (MC - frac * MC).toFixed(2),
        offset: (-macc * MC).toFixed(2), share: (frac * 100).toFixed(1) + "%"
      };
      macc += frac;
      return seg;
    });
    const top10Share = pdRows.slice().sort((a, z) => (z.cur_value || 0) - (a.cur_value || 0))
      .slice(0, 10).reduce((a, r) => a + (r.cur_value || 0), 0) / pdTotCur;
    const pdConc = {
      total: this.cur(pdTotCur),
      pct: (top10Share * 100).toFixed(1) + "%",
      needle: Math.min(100, top10Share * 100).toFixed(1) + "%",
      level: top10Share > 0.5 ? "High" : top10Share > 0.3 ? "Medium" : "Low",
      color: top10Share > 0.5 ? "#D94F3A" : top10Share > 0.3 ? "#E8A838" : "#22C55E",
      note: "The top 10 products carry " + (top10Share * 100).toFixed(1) + "% of tracked value across "
        + this.int(mixSorted.length) + " categories."
    };

    /* white space — growing but under-distributed */
    const medReach = (function () {
      const a = pdRows.filter(r => r.stores_latest != null).map(r => r.stores_latest).sort((x, y) => x - y);
      return a.length ? a[Math.floor(a.length / 2)] : 0;
    })();
    const whiteSpace = pdRows
      .filter(r => r.stores_latest != null && pdNet && r.value_vs_pct != null
        && r.value_vs_pct > 0.05 && r.stores_latest < medReach * 1.5 && (r.cur_value || 0) > 0)
      .sort((a, z) => (z.value_vs_pct || 0) - (a.value_vs_pct || 0))
      .slice(0, 6)
      .map(r => ({
        name: this.title(r.product), category: r.category ? this.title(r.category) : "—",
        reach: (r.stores_latest / pdNet * 100).toFixed(1) + "%",
        reachBar: Math.min(100, r.stores_latest / pdNet * 100).toFixed(1) + "%",
        stores: this.int(r.stores_latest),
        vs: this.pct(r.value_vs_pct), vsColor: this.tone(r.value_vs_pct),
        value: this.cur(r.cur_value)
      }));
    const whiteSpaceNote = "Products growing faster than +5% that sit below the "
      + this.int(medReach) + "-store median reach — the distribution upside.";

    const pdTile = (label, value, vs, note, absDelta) => {
      const up = vs != null && vs > 0;
      return {
        label, value, note,
        delta: absDelta != null ? Math.abs(absDelta) : this.bare(vs, 1),
        arrow: absDelta != null ? (absDelta >= 0 ? "▲" : "▼") : (vs == null ? "" : up ? "▲" : "▼"),
        color: absDelta != null ? this.tone(absDelta) : this.tone(vs),
        pillBg: absDelta != null ? (absDelta >= 0 ? "rgba(34,197,94,.12)" : "rgba(217,79,58,.12)")
          : vs == null ? "rgba(91,155,213,.12)" : up ? "rgba(34,197,94,.12)" : "rgba(217,79,58,.12)"
      };
    };
    const avgReach = pdRows.filter(r => r.stores_latest != null);
    const vGrow = pdTotLy ? pdTotCur / pdTotLy - 1 : null;
    const uGrow = pdTotUnitsLy ? pdTotUnits / pdTotUnitsLy - 1 : null;
    const pGrow = pdPrice && pdPriceLy ? pdPrice / pdPriceLy - 1 : null;
    const withSpark = (tile, sp) => Object.assign(tile, {
      sparkPath: sp.path || "M0 15 L100 15",
      sparkColor: sp.path ? sp.color : "#2a4365",
      sparkDash: sp.path ? "none" : "3 3"
    });
    const pdKpis = [
      withSpark(pdTile("Total product value", this.cur(pdTotCur), vGrow, "vs prior 12m"), kSpark(valTrend, vGrow > 0)),
      withSpark(pdTile("Units sold", this.num(pdTotUnits), uGrow, "vs prior 12m"), kSpark(unitTrend, uGrow > 0)),
      withSpark(pdTile("Active SKUs", this.int(activeSkus),
        activeSkusLy ? activeSkus / activeSkusLy - 1 : null, "vs prior 12m", activeSkus - activeSkusLy), { path: "", color: "#4A6B8A" }),
      withSpark(pdTile("Avg selling price", pdPrice ? "R" + pdPrice.toFixed(2) : "—", pGrow, "vs prior 12m"), kSpark(priceTrend, pGrow > 0)),
      withSpark(pdTile("Weighted distribution", wDist == null ? "—" : (wDist * 100).toFixed(1) + "%", null, "value-weighted reach"), { path: "", color: "#4A6B8A" }),
      withSpark(pdTile("New / went quiet", this.int(newProds.length) + " / " + this.int(quietProds.length), null,
        "since " + this.mon(quietCutoff, true)), { path: "", color: "#4A6B8A" })
    ];

    const pdTopGain = pdRows.slice().sort(pdSorters.gain)[0];
    const pdTopDrop = pdRows.slice().sort(pdSorters.drop)[0];
    const pdNewBest = newProds.slice().sort((a, z) => (z.cur_value || 0) - (a.cur_value || 0))[0] || {};
    const pdQuietBiggest = quietProds.slice().sort((a, z) => (z.ly_value || 0) - (a.ly_value || 0))[0] || {};
    const pdCards = [
      {
        kicker: "Biggest gain", iconColor: "#22C55E", iconBg: "rgba(34,197,94,.12)", iconBorder: "rgba(34,197,94,.35)",
        icon: "M7 17 17 7M17 7h-6M17 7v6",
        body: pdTopGain ? this.title(pdTopGain.product) + " added " + this.cur((pdTopGain.cur_value || 0) - (pdTopGain.ly_value || 0)) + " (" + this.pct(pdTopGain.value_vs_pct) + ")." : "—"
      },
      {
        kicker: "Biggest decline", iconColor: "#D94F3A", iconBg: "rgba(217,79,58,.12)", iconBorder: "rgba(217,79,58,.4)",
        icon: "M7 7 17 17M17 17h-6M17 17v-6",
        body: pdTopDrop ? this.title(pdTopDrop.product) + " declined " + this.cur(Math.abs((pdTopDrop.cur_value || 0) - (pdTopDrop.ly_value || 0))) + " (" + this.pct(pdTopDrop.value_vs_pct) + ")." : "—"
      },
      {
        kicker: newProds.length ? "Best new listing" : "Watch list", iconColor: "#ec6d25", iconBg: "rgba(236,109,37,.12)", iconBorder: "rgba(236,109,37,.4)",
        icon: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM12 8v8M8 12h8",
        body: pdNewBest
          ? this.title(pdNewBest.product) + " is the strongest launch at " + this.cur(pdNewBest.cur_value)
            + (pdNewBest.stores_latest != null && pdNet ? " across " + this.int(pdNewBest.stores_latest) + " stores (" + (pdNewBest.stores_latest / pdNet * 100).toFixed(1) + "% reach)." : ".")
          : pdQuietBiggest ? this.title(pdQuietBiggest.product) + " stopped selling — " + this.cur(pdQuietBiggest.ly_value) + " in the prior year." : "—"
      }
    ];
    const pdHeadline = "Tracked products total " + this.cur(pdTotCur) + " over the 12 months to "
      + this.mon(pdComplete, true) + ", "
      + (pdTotLy ? (pdTotCur >= pdTotLy ? "up " : "down ") + this.bare(pdTotCur / pdTotLy - 1) : "flat")
      + " on the prior year, on " + this.num(pdTotUnits) + " units ("
      + this.pct(pdTotUnitsLy ? pdTotUnits / pdTotUnitsLy - 1 : null) + ").";
    const pdNote = this.int(pdRows.length) + " tracked products"
      + (pdNet ? " · network of " + this.int(pdNet) + " stores" : "")
      + " · 12 months to " + this.mon(pdComplete, true);
    const pdCount = "Showing " + productDetailRows.length + " of " + this.int(pdFiltered.length) + " products";

    /* product league — value only, with a Pareto read */
    const pq = (S.pq || "").trim().toLowerCase();
    const prodSorted = realProducts.slice().sort((a, z) => z.sales_value - a.sales_value);
    let cum = 0;
    const prodWithCum = prodSorted.map((r, i) => {
      cum += r.sales_value;
      return { name: r.product, value: r.sales_value, share: r.sales_value / prodTotal, cumShare: cum / prodTotal, rank: i + 1 };
    });
    const paretoIdx = prodWithCum.findIndex(r => r.cumShare >= 0.8);
    const prodFiltered = prodWithCum.filter(r => !pq || String(r.name).toLowerCase().indexOf(pq) > -1);
    const prodLimit = S.prodLimit || 15;
    const prodMax = prodFiltered.length ? prodFiltered[0].value : 1;
    const productRows = prodFiltered.slice(0, prodLimit).map(r => ({
      rank: r.rank, name: this.title(r.name), value: this.cur(r.value),
      share: (r.share * 100).toFixed(2) + "%", cum: (r.cumShare * 100).toFixed(1) + "%",
      bar: (r.value / prodMax * 100).toFixed(1) + "%"
    }));
    const productCount = "Showing " + productRows.length + " of " + this.int(prodFiltered.length) + " products";
    const paretoNote = paretoIdx > -1
      ? "The top " + this.int(paretoIdx + 1) + " products of " + this.int(prodWithCum.length)
        + " (" + ((paretoIdx + 1) / prodWithCum.length * 100).toFixed(1) + "%) carry 80% of recorded value."
      : "";

    const catUp = catList.slice().sort((a, z) => (z.cv - z.lv) - (a.cv - a.lv))[0] || {};
    const catDown = catList.slice().sort((a, z) => (a.cv - a.lv) - (z.cv - z.lv))[0] || {};
    const catLead = catList.slice().sort((a, z) => z.cv - a.cv)[0] || {};
    const productCards = [
      {
        kicker: "Largest category", iconColor: "#ec6d25", iconBg: "rgba(236,109,37,.12)", iconBorder: "rgba(236,109,37,.4)",
        icon: "M21 8v8a2 2 0 0 1-1 1.73l-7 4a2 2 0 0 1-2 0l-7-4A2 2 0 0 1 3 16V8",
        body: catLead ? this.title(catLead.name) + " leads at " + this.cur(catLead.cv) + " — " + (catLead.cv / catCur * 100).toFixed(1) + "% of category value, " + this.pct(catLead.lv ? catLead.cv / catLead.lv - 1 : null) + " on last year." : "—"
      },
      {
        kicker: "Biggest gain", iconColor: "#22C55E", iconBg: "rgba(34,197,94,.12)", iconBorder: "rgba(34,197,94,.35)",
        icon: "M7 17 17 7M17 7h-6M17 7v6",
        body: catUp ? this.title(catUp.name) + " added " + this.cur(catUp.cv - catUp.lv) + " (" + this.pct(catUp.lv ? catUp.cv / catUp.lv - 1 : null) + ")." : "—"
      },
      {
        kicker: "Biggest decline", iconColor: "#D94F3A", iconBg: "rgba(217,79,58,.12)", iconBorder: "rgba(217,79,58,.4)",
        icon: "M7 7 17 17M17 17h-6M17 17v-6",
        body: catDown ? this.title(catDown.name) + " declined " + this.cur(Math.abs(catDown.cv - catDown.lv)) + " (" + this.pct(catDown.lv ? catDown.cv / catDown.lv - 1 : null) + ")." : "—"
      }
    ];

    /* ---------------- Price & Mix page ---------------- */
    const pmN = rollN || 12;
    const pmEnd = monthsAll.indexOf(series[lastComplete].month);
    const pmCur = monthsAll.slice(Math.max(0, pmEnd - pmN + 1), pmEnd + 1);
    const pmPrev = monthsAll.slice(Math.max(0, pmEnd - pmN * 2 + 1), Math.max(0, pmEnd - pmN + 1));
    const pmCmpWord = pmN === 12 ? "prior year" : "prior " + pmN + " months";

    /* category-level three-way decomposition: volume, mix, price */
    const pmCat = {};
    d.category_monthly.forEach(r => {
      const t = pmCat[r.category] || (pmCat[r.category] = { cv: 0, cu: 0, pv: 0, pu: 0 });
      if (pmCur.indexOf(r.month) > -1) { t.cv += r.sales_value; t.cu += r.sales_units; }
      else if (pmPrev.indexOf(r.month) > -1) { t.pv += r.sales_value; t.pu += r.sales_units; }
    });
    const pmList = Object.keys(pmCat).map(k => Object.assign({ name: k }, pmCat[k]));
    const pmCurV = pmList.reduce((a, r) => a + r.cv, 0);
    const pmCurU = pmList.reduce((a, r) => a + r.cu, 0);
    const pmPrevV = pmList.reduce((a, r) => a + r.pv, 0);
    const pmPrevU = pmList.reduce((a, r) => a + r.pu, 0);
    const pmCurP = pmCurU ? pmCurV / pmCurU : 0;
    const pmPrevP = pmPrevU ? pmPrevV / pmPrevU : 0;
    /* Volume × price is an exact identity at total level:
         (curU - prevU)·prevP + (curP - prevP)·curU = curV - prevV
       The price term is then split into like-for-like price movement (each
       category's own price on its current units) and the mix residual. */
    const effVolume = (pmCurU - pmPrevU) * pmPrevP;
    const effPriceTotal = (pmCurP - pmPrevP) * pmCurU;
    let effPriceLfl = 0;
    pmList.forEach(r => {
      if (!r.cu || !r.pu) return;
      effPriceLfl += (r.cv / r.cu - r.pv / r.pu) * r.cu;
    });
    const effMix = effPriceTotal - effPriceLfl;
    const effPrice = effPriceLfl;
    const pmNet = pmCurV - pmPrevV;
    const pmResidual = pmNet - (effVolume + effPrice + effMix);

    const pmBridgeSteps = [
      { name: "Volume", value: effVolume, kind: "delta" },
      { name: "Mix", value: effMix, kind: "delta" },
      { name: "Price", value: effPrice, kind: "delta" },
      { name: "Net change", value: pmNet, kind: "net" }
    ];
    let pmRun = 0;
    const pmPts = [0];
    pmBridgeSteps.forEach(st => { if (st.kind === "delta") { pmRun += st.value; pmPts.push(pmRun); } });
    pmPts.push(pmNet);
    const pmLo = Math.min(0, ...pmPts), pmHi = Math.max(0, ...pmPts);
    const PMW = 620, PMH = 230, pmSpan = (pmHi - pmLo) || 1;
    const pmY = (v) => PMH - 26 - ((v - pmLo) / pmSpan) * (PMH - 52);
    const pmSlot = PMW / pmBridgeSteps.length, pmBarW = Math.min(70, pmSlot * 0.46);
    let pmCursor = 0;
    const pmBridge = pmBridgeSteps.map((st, i) => {
      let from, to;
      if (st.kind === "net") { from = 0; to = pmNet; }
      else { from = pmCursor; to = pmCursor + st.value; pmCursor = to; }
      const y1 = pmY(from), y2 = pmY(to);
      const top = Math.min(y1, y2), h = Math.max(3, Math.abs(y2 - y1));
      return {
        name: st.name,
        label: (st.value >= 0 ? "+" : "−") + this.cur(Math.abs(st.value)).replace("−", ""),
        x: (i * pmSlot + (pmSlot - pmBarW) / 2).toFixed(1), w: pmBarW.toFixed(1),
        y: top.toFixed(1), h: h.toFixed(1),
        pctX: ((i * pmSlot + pmSlot / 2) / PMW * 100).toFixed(2) + "%",
        pctY: (top / PMH * 100).toFixed(2) + "%",
        fill: st.kind === "net" ? "#1E3A52" : st.value >= 0 ? "#22C55E" : "#D94F3A",
        stroke: st.kind === "net" ? "#5B9BD5" : "none",
        color: st.kind === "net" ? "#f3f7fc" : st.value >= 0 ? "#22C55E" : "#D94F3A"
      };
    });
    const pmBridgeGrid = [];
    for (let i = 4; i >= 0; i--) {
      const v = pmLo + (pmSpan * i) / 4;
      pmBridgeGrid.push({ y: pmY(v).toFixed(1), pctY: (pmY(v) / 230 * 100).toFixed(2) + "%", label: this.cur(v) });
    }
    const pmZero = pmY(0).toFixed(1);

    const pmTile = (label, value, note, color) => ({ label, value, note, color: color || "#f3f7fc" });
    const pmKpis = [
      pmTile("Average price", "R" + pmCurP.toFixed(2),
        this.pct(pmPrevP ? pmCurP / pmPrevP - 1 : null) + " vs " + pmCmpWord, this.tone(pmPrevP ? pmCurP / pmPrevP - 1 : null)),
      pmTile("Price effect", this.cur(effPrice), "of a " + this.cur(pmNet) + " move", this.tone(effPrice)),
      pmTile("Volume effect", this.cur(effVolume), "of a " + this.cur(pmNet) + " move", this.tone(effVolume)),
      pmTile("Mix effect", this.cur(effMix), "of a " + this.cur(pmNet) + " move", this.tone(effMix)),
      pmTile("Net change", this.cur(pmNet), this.pct(pmPrevV ? pmCurV / pmPrevV - 1 : null) + " vs " + pmCmpWord, this.tone(pmNet))
    ];

    /* average price trend, full history -- a month with zero sales_units
       comes back from get_price_mix with avg_price=null (get_price_mix's own
       _safe_div guard against a real divide-by-zero); a null here previously
       flowed straight into pmpY() where JS silently coerces null to 0,
       plotting a false "price crashed to zero" point instead of leaving that
       month out of the line (flagged 2026-08-21). Drop those months instead. */
    const pmMonthly = d.price_mix.monthly.filter(r => r.avg_price != null).map(r => ({ month: r.month, price: r.avg_price }));
    const pmpHi = Math.max(...pmMonthly.map(r => r.price), 1);
    const pmpLo = pmMonthly.length ? Math.min(...pmMonthly.map(r => r.price)) : 0;
    const PPW = 1000, PPH = 240, pmpSpan = (pmpHi - pmpLo) || 1;
    const pmpY = (v) => PPH - 26 - ((v - pmpLo) / pmpSpan) * (PPH - 52);
    const pmpX = (i) => 52 + (i / Math.max(1, pmMonthly.length - 1)) * (PPW - 52);
    const priceLine = pmMonthly.map((r, i) => (i ? "L" : "M") + pmpX(i).toFixed(1) + " " + pmpY(r.price).toFixed(1)).join(" ");
    const priceAvg3 = pmMonthly.map((r, i) => {
      const w = pmMonthly.slice(Math.max(0, i - 2), i + 1);
      return w.reduce((a, x) => a + x.price, 0) / w.length;
    });
    const priceAvgLine = priceAvg3.map((v, i) => (i ? "L" : "M") + pmpX(i).toFixed(1) + " " + pmpY(v).toFixed(1)).join(" ");
    const priceGrid = [];
    for (let i = 4; i >= 0; i--) {
      const v = pmpLo + (pmpSpan * i) / 4;
      priceGrid.push({ y: pmpY(v).toFixed(1), pctY: (pmpY(v) / 240 * 100).toFixed(2) + "%", label: "R" + v.toFixed(2) });
    }
    const priceTicks = pmMonthly.filter((r, i) => i % 5 === 0).map(r => this.mon(r.month, true));
    const priceHovers = pmMonthly.map((r, i) => ({
      label: this.mon(r.month, true), price: "R" + r.price.toFixed(2), avg: "R" + priceAvg3[i].toFixed(2)
    }));

    /* elasticity read: price change against volume change, by category */
    const elTop = pmList.filter(r => r.cu && r.pu && r.cv > 0).sort((a, z) => z.cv - a.cv).slice(0, 24);
    const elDom = 0.4;
    const EW = 560, EH = 300, EPX = 34, EPY = 26;
    const elCap = (v) => Math.max(-elDom, Math.min(elDom, v));
    const elX = (v) => EPX + ((elCap(v) + elDom) / (elDom * 2)) * (EW - EPX * 2);
    const elY = (v) => (EH - EPY) - ((elCap(v) + elDom) / (elDom * 2)) * (EH - EPY * 2);
    const elMaxV = Math.max(...elTop.map(r => r.cv), 1);
    const elDots = elTop.map(r => {
      const cp = r.cv / r.cu, pp = r.pv / r.pu;
      const dP = pp ? cp / pp - 1 : 0, dU = r.pu ? r.cu / r.pu - 1 : 0;
      const off = Math.abs(dP) > elDom || Math.abs(dU) > elDom;
      return {
        name: this.title(r.name),
        cx: elX(dP).toFixed(1), cy: elY(dU).toFixed(1),
        r: (5 + Math.sqrt(r.cv / elMaxV) * 13).toFixed(1),
        ringR: (5 + Math.sqrt(r.cv / elMaxV) * 13 + 3.5).toFixed(1),
        ringOpacity: off ? 0.9 : 0,
        fill: dP >= 0 && dU >= 0 ? "rgba(34,197,94,.55)"
          : dP >= 0 ? "rgba(236,109,37,.55)"
          : dU >= 0 ? "rgba(91,155,213,.55)" : "rgba(217,79,58,.5)",
        tip: this.title(r.name) + " · " + this.cur(r.cv) + " · price " + this.pct(dP) + " · volume " + this.pct(dU)
          + (off ? " (beyond ±40%, pinned)" : "")
      };
    });
    const elTicks = [-0.4, -0.2, 0, 0.2, 0.4].map(v => ({
      label: (v > 0 ? "+" : "") + (v * 100).toFixed(0) + "%",
      x: elX(v).toFixed(1), pctX: (elX(v) / EW * 100).toFixed(2) + "%"
    }));
    const elYTicks = [0.4, 0.2, 0, -0.2, -0.4].map(v => ({
      label: (v > 0 ? "+" : "") + (v * 100).toFixed(0) + "%",
      y: elY(v).toFixed(1), pctY: (elY(v) / EH * 100).toFixed(2) + "%"
    }));
    const elQuads = [
      { label: "Price up, volume up", x: "58%", y: "2%", color: "#22C55E" },
      { label: "Price down, volume up", x: "5%", y: "2%", color: "#5B9BD5" },
      { label: "Price up, volume down", x: "58%", y: "89%", color: "#ec6d25" },
      { label: "Both down", x: "5%", y: "89%", color: "#D94F3A" }
    ];

    /* category price table */
    const pmSort = S.pmSort || "impact";
    const pmRowsAll = pmList.filter(r => r.cv > 0 || r.pv > 0).map(r => {
      const cp = r.cu ? r.cv / r.cu : null, pp = r.pu ? r.pv / r.pu : null;
      const priceEff = (cp != null && pp != null) ? (cp - pp) * r.cu : 0;
      const volEff = (pp != null) ? (r.cu - r.pu) * pp : 0;
      return {
        name: r.name, cv: r.cv, cp, pp,
        dP: cp && pp ? cp / pp - 1 : null,
        dU: r.pu ? r.cu / r.pu - 1 : null,
        priceEff, volEff, net: r.cv - r.pv
      };
    });
    const pmSorters = {
      impact: (a, z) => Math.abs(z.net) - Math.abs(a.net),
      price: (a, z) => Math.abs(z.priceEff) - Math.abs(a.priceEff),
      volume: (a, z) => Math.abs(z.volEff) - Math.abs(a.volEff),
      value: (a, z) => z.cv - a.cv
    };
    const pmSortOpts = [
      { key: "impact", label: "Net impact" }, { key: "price", label: "Price effect" },
      { key: "volume", label: "Volume effect" }, { key: "value", label: "Size" }
    ].map(o => ({ label: o.label, on: pmSort === o.key, pick: () => this.setState({ pmSort: o.key, pmLimit: 12 }) }));
    const pmLimit = S.pmLimit || 12;
    const pmSorted = pmRowsAll.slice().sort(pmSorters[pmSort] || pmSorters.impact);
    const pmEffMax = Math.max(...pmSorted.slice(0, pmLimit).map(r => Math.max(Math.abs(r.priceEff), Math.abs(r.volEff))), 1);
    const priceMixRows = pmSorted.slice(0, pmLimit).map((r, i) => ({
      rank: i + 1, name: this.title(r.name),
      value: this.cur(r.cv),
      price: r.cp ? "R" + r.cp.toFixed(2) : "—",
      dP: this.pct(r.dP), dPColor: this.tone(r.dP),
      dU: this.pct(r.dU), dUColor: this.tone(r.dU),
      priceEff: this.cur(r.priceEff), priceEffColor: this.tone(r.priceEff),
      priceW: (Math.abs(r.priceEff) / pmEffMax * 100).toFixed(1) + "%",
      priceFill: r.priceEff >= 0 ? "#22C55E" : "#D94F3A",
      volEff: this.cur(r.volEff), volEffColor: this.tone(r.volEff),
      volW: (Math.abs(r.volEff) / pmEffMax * 100).toFixed(1) + "%",
      volFill: r.volEff >= 0 ? "#22C55E" : "#D94F3A",
      net: this.cur(r.net), netColor: this.tone(r.net)
    }));
    const pmCount = "Showing " + priceMixRows.length + " of " + pmSorted.length + " categories";

    const biggestPrice = pmRowsAll.slice().sort((a, z) => Math.abs(z.priceEff) - Math.abs(a.priceEff))[0] || {};
    const biggestVol = pmRowsAll.slice().sort((a, z) => Math.abs(z.volEff) - Math.abs(a.volEff))[0] || {};
    const pmCards = [
      {
        kicker: "What drove the change", iconColor: "#ec6d25", iconBg: "rgba(236,109,37,.12)", iconBorder: "rgba(236,109,37,.4)",
        icon: "M4 20V10M10 20V4M16 20v-7M22 20H2",
        body: "Of the " + this.cur(pmNet) + " change, volume accounts for " + this.cur(effVolume)
          + ", price " + this.cur(effPrice) + " and mix " + this.cur(effMix) + "."
      },
      {
        kicker: "Largest price move", iconColor: "#5B9BD5", iconBg: "rgba(91,155,213,.12)", iconBorder: "rgba(91,155,213,.4)",
        icon: "M19 5 5 19M6.5 9a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5ZM17.5 20a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z",
        body: biggestPrice ? this.title(biggestPrice.name) + " moved price " + this.pct(biggestPrice.dP)
          + ", worth " + this.cur(biggestPrice.priceEff) + "." : "—"
      },
      {
        kicker: "Largest volume move", iconColor: "#22C55E", iconBg: "rgba(34,197,94,.12)", iconBorder: "rgba(34,197,94,.35)",
        icon: "M21 8v8a2 2 0 0 1-1 1.73l-7 4a2 2 0 0 1-2 0l-7-4A2 2 0 0 1 3 16V8",
        body: biggestVol ? this.title(biggestVol.name) + " moved volume " + this.pct(biggestVol.dU)
          + ", worth " + this.cur(biggestVol.volEff) + "." : "—"
      }
    ];
    const pmHeadline = "Average price is R" + pmCurP.toFixed(2) + " over the " + pmN + " months to "
      + this.mon(series[lastComplete].month, true) + ", " + this.pct(pmPrevP ? pmCurP / pmPrevP - 1 : null)
      + " on the " + pmCmpWord + ", on " + this.num(pmCurU) + " units.";
    const pmNote = pmList.length + " categories · " + pmN + " months to " + this.mon(series[lastComplete].month, true)
      + " against the " + pmCmpWord;

    /* month-by-month table (Trend page) */
    const monthCols = [
      { label: "Month", align: "left", color: "#4A6B8A" },
      { label: "Value " + (curYear - 1), align: "right", color: "#ec6d25" },
      { label: "Value " + curYear, align: "right", color: "#ec6d25" },
      { label: "Value vs LY", align: "right", color: "#ec6d25" },
      { label: "Volume " + (curYear - 1), align: "right", color: "#5B9BD5" },
      { label: "Volume " + curYear, align: "right", color: "#5B9BD5" },
      { label: "Volume vs LY", align: "right", color: "#5B9BD5" },
      { label: "Avg price", align: "right", color: "#8DA2B5" },
      { label: "Price / mix", align: "right", color: "#8DA2B5" }
    ];
    const monthRows = ytdMonths.map(r => {
      const ly = lyMonths.find(x => x.month.slice(5, 7) === r.month.slice(5, 7));
      const vVs = ly && ly.value ? r.value / ly.value - 1 : null;
      const uVs = ly && ly.units ? r.units / ly.units - 1 : null;
      const p = r.units ? r.value / r.units : null;
      const pLy = ly && ly.units ? ly.value / ly.units : null;
      const pVs = p && pLy ? p / pLy - 1 : null;
      return {
        month: this.mon(r.month, true),
        valueLy: ly ? this.cur(ly.value) : "—",
        value: this.cur(r.value),
        unitsLy: ly ? this.num(ly.units) : "—",
        units: this.num(r.units),
        vVs: this.pct(vVs), vVsColor: this.tone(vVs),
        uVs: this.pct(uVs), uVsColor: this.tone(uVs),
        price: p ? "R" + p.toFixed(2) : "—",
        pVs: this.pct(pVs), pVsColor: this.tone(pVs)
      };
    }).reverse();

    /* breakdown */
    const dimSrc = { region: d.dimension_region, banner: d.dimension_banner, brand: d.dimension_brand }[S.dim];
    const dRows = dimSrc.rows.slice().sort((a, z) => (isVal ? z.cur_value - a.cur_value : z.cur_units - a.cur_units)).slice(0, 12);
    const dMax = Math.max(...dRows.map(r => Math.max(isVal ? r.cur_value : r.cur_units, isVal ? r.ly_value : r.ly_units)), 1);
    const dimRows = dRows.map(r => {
      const c = isVal ? r.cur_value : r.cur_units, l = isVal ? r.ly_value : r.ly_units, vs = isVal ? r.value_vs_pct : r.units_vs_pct;
      return { name: this.title(r.dim), curW: (c / dMax * 100).toFixed(1) + "%", lyW: (l / dMax * 100).toFixed(1) + "%", cur: isVal ? this.cur(c) : this.num(c), vs: this.pct(vs), color: this.tone(vs) };
    });

    /* mix */
    const palette = ["#ec6d25", "#f2955c", "#5B9BD5", "#3B82F6", "#9dc4ec", "#4A6B8A"];
    const mkMix = (title, rows) => ({
      title,
      segs: rows.map((r, i) => {
        const share = isVal ? r.val_12m_share : r.vol_12m_share, vs = isVal ? r.val_12m_vs_pp : r.vol_12m_vs_pp;
        return { label: r.bucket, fill: palette[i % palette.length], w: (share * 100).toFixed(1) + "%", share: (share * 100).toFixed(1) + "%", vs: this.pct(vs), color: this.tone(vs), tip: r.bucket + " — " + this.cur(r.val_12m) + " (12m)" };
      })
    });
    const mixBlocks = [mkMix("By product bucket", d.bucket_summary), mkMix("By retailer type", d.banner_bucket_summary)];

    /* top sellers */
    const src = { brands: [d.brands, "brand"], categories: [d.categories, "category"], products: [d.products, "product"] }[S.top];
    const clean = src[0].filter(r => r[src[1]] && String(r[src[1]]).toLowerCase() !== "nan").slice(0, 10);
    const tMax = Math.max(...clean.map(r => r.sales_value), 1);
    const topRows = clean.map((r, i) => ({ rank: i + 1, name: this.title(r[src[1]]), value: this.cur(r.sales_value), w: (r.sales_value / tMax * 100).toFixed(1) + "%" }));

    /* stores */
    const tierOpts = [{ key: "all", label: "All tiers" }].concat(Array.from(new Set(d.store_performance.map(s => s.tier))).sort().map(t => ({ key: t, label: t })));
    // Was sourced from d.store_performance, lazy-loaded only once the
    // Stores page had been visited -- same bug as regionOpts/brandOpts had.
    // d.dimension_banner_eager is fetched eagerly in loadCore() specifically
    // for this global filter (separate from the lazy, filter-scoped
    // d.dimension_banner used by the Channels page itself).
    const bannerOpts = [{ key: "all", label: "All retailers" }].concat(d.dimension_banner_eager.rows.map(r => r.dim).filter(Boolean).sort().map(x => ({ key: x, label: this.title(x) })));
    const qq = S.q.trim().toLowerCase();
    let stores = d.store_performance.filter(s =>
      (S.tier === "all" || s.tier === S.tier) &&
      (S.banner === "all" || s.banner === S.banner) &&
      (!qq || (s.store_name + " " + s.banner + " " + (s.top_brand || "") + " " + (s.client || "")).toLowerCase().includes(qq)));
    const sorters = {
      val: (a, z) => z.val_12m - a.val_12m,
      growth: (a, z) => (z.growth_yoy == null ? -9 : z.growth_yoy) - (a.growth_yoy == null ? -9 : a.growth_yoy),
      decline: (a, z) => (a.growth_yoy == null ? 9 : a.growth_yoy) - (z.growth_yoy == null ? 9 : z.growth_yoy),
      streak: (a, z) => (z.consecutive_decline_months || 0) - (a.consecutive_decline_months || 0) || z.val_12m - a.val_12m,
      g3: (a, z) => (z.growth_3m == null ? -9 : z.growth_3m) - (a.growth_3m == null ? -9 : a.growth_3m)
    };
    stores = stores.sort(sorters[S.sort] || sorters.val);
    const tierStyle = (t) => /Strong/.test(t) ? ["#22C55E", "rgba(34,197,94,.14)", "rgba(34,197,94,.4)"]
      : /Moderate/.test(t) ? ["#9dc4ec", "rgba(59,130,246,.14)", "rgba(59,130,246,.4)"]
      : /Intervention/.test(t) ? ["#D94F3A", "rgba(217,79,58,.14)", "rgba(217,79,58,.4)"]
      : ["#E8A838", "rgba(232,168,56,.14)", "rgba(232,168,56,.4)"];
    const storeRows = stores.slice(0, S.limit).map((s, i) => {
      const ts = tierStyle(s.tier), vs = isVal ? s.val_12m_vs_pp : s.vol_12m_vs_pp;
      return {
        rank: i + 1, store: this.title(s.store_name), banner: this.title(s.banner), brand: this.title(s.top_brand) || "—",
        val: isVal ? this.cur(s.val_12m) : this.num(s.vol_12m),
        vs: this.pct(vs, 0), vsColor: this.tone(vs),
        g3: this.pct(s.growth_3m, 0), g3Color: this.tone(s.growth_3m),
        yoy: this.pct(s.growth_yoy, 0), yoyColor: this.tone(s.growth_yoy),
        spark: this.path(isVal ? s.trend_value : s.trend_units, 90, 22),
        sparkColor: (s.growth_3m || 0) >= 0 ? "#22C55E" : "#D94F3A",
        tier: s.tier.replace(/ - .*/, "").replace(/ \(.*/, ""),
        tierColor: ts[0], tierBg: ts[1], tierBorder: ts[2]
      };
    });

    /* signals */
    const sigSrc = { growing: d.insights_stores_growing, at_risk: d.insights_stores_at_risk, declining: d.insights_stores_declining }[S.signal];
    const signalNote = {
      growing: "Top-ranked stores trading above their size-peer average.",
      at_risk: "Above-norm stores now declining — largest value first.",
      declining: "Consecutive monthly declines against a falling 3-month base."
    }[S.signal];
    const signalRows = sigSrc.slice(0, 12).map(r => ({
      store: this.title(r["cleaned store name"]),
      meta: (r["Store Size Profile (Value)"] || "") + " · rank #" + r.Rank_Value_12M + " · " + (r.ConsecutiveDeclineMonths || 0) + "m decline streak",
      val12: this.cur(r.Value_12M),
      g3: this.pct(r.Growth_3M, 0), g3Color: this.tone(r.Growth_3M),
      yoy: this.pct(r.Growth_YoY, 0), yoyColor: this.tone(r.Growth_YoY),
      peer: this.cur(r.Growth_vs_Peer), peerColor: this.tone(r.Growth_vs_Peer)
    }));
    const brandRows = d.insights_brands.slice(0, 12).map(r => ({
      brand: this.title(r["cleaned brand"]), store: this.title(r["cleaned store name"]),
      share: (r.Brand_Share * 100).toFixed(0) + "%",
      vsPeer: this.pp(r.Brand_Share_vs_Peer), vsColor: this.tone(r.Brand_Share_vs_Peer)
    }));

    /* executive intelligence — scoped wherever the extract allows it */
    const anyFilter = S.client !== "all" || S.category !== "all" || S.region !== "all" || S.brand !== "all" || S.product !== "all";
    const wholeTag = anyFilter ? " (all clients)" : "";
    const c1 = series[lastComplete], c0 = series[lastComplete - 1];
    const pr1 = c1 && c1.units ? c1.value / c1.units : 0;
    const pr0 = c0 && c0.units ? c0.value / c0.units : 0;
    const volEffect = c0 ? (c1.units - c0.units) * pr0 : null;
    const priceEffect = c0 ? (pr1 - pr0) * c1.units : null;
    const netEffect = c0 ? c1.value - c0.value : null;
    const avg6 = winSum(lastComplete - 1, 6, "value") / 6;
    const v3 = winVsYear(3, "value"), v6 = winVsYear(6, "value"), v12 = winVsYear(12, "value");

    const regRows = d.dimension_region.rows.slice().sort((a, z) => z.cur_value - a.cur_value);
    const regTotal = regRows.reduce((a, r) => a + r.cur_value, 0) || 1;
    const catAll = d.categories.reduce((a, r) => a + r.sales_value, 0) || 1;
    const improving = d.store_performance.filter(s => (s.growth_3m || 0) > 0).length;
    // d.dimension_brand.rows is [] until the Brands page's own lazy fetch
    // completes -- [0] on an empty array is undefined, and this ran
    // unconditionally regardless of active page, crashing the whole render.
    const brandUp = d.dimension_brand.rows.slice().sort((a, z) => z.delta_value - a.delta_value)[0] || { dim: "", delta_value: 0 };
    const brandDown = d.dimension_brand.rows.slice().sort((a, z) => a.delta_value - z.delta_value)[0] || { dim: "", delta_value: 0 };
    const atRisk = d.insights_stores_at_risk.slice().sort((a, z) => z.Value_12M - a.Value_12M)[0] || {};
    const streak = d.insights_stores_declining.slice().sort((a, z) => (z.ConsecutiveDeclineMonths || 0) - (a.ConsecutiveDeclineMonths || 0))[0] || {};
    const standout = d.insights_brands.slice().sort((a, z) => z.Brand_Share_vs_Peer - a.Brand_Share_vs_Peer)[0] || {};

    /* biggest driver: the chosen category's own weight when one is picked, else the month's leader */
    const monthTotal = (d.monthly_trend.find(m => m.month === cur.month) || {}).sales_value || 0;
    const catThisMonth = d.category_monthly.filter(r => r.month === cur.month).sort((a, z) => z.sales_value - a.sales_value);
    const catTotal = catThisMonth.reduce((a, r) => a + r.sales_value, 0) || 1;
    let driverBody;
    if (brandRow) {
      driverBody = this.title(S.brand) + " carried " + this.cur(brandRow.cur_value) + " over the rolling 12 months, " + this.pct(brandRow.value_vs_pct) + " on the prior year.";
    } else if (S.category !== "all") {
      const row = catThisMonth.find(r => r.category === S.category);
      driverBody = row
        ? this.title(S.category) + " generated " + this.cur(row.sales_value) + " in " + this.mon(cur.month, true) + " — " + this.bare(monthTotal ? row.sales_value / monthTotal : null) + " of all sales that month."
        : this.title(S.category) + " recorded no sales in " + this.mon(cur.month, true) + ".";
    } else if (catThisMonth[0]) {
      driverBody = this.title(catThisMonth[0].category) + " generated " + this.cur(catThisMonth[0].sales_value) + " and represented " + this.bare(catThisMonth[0].sales_value / catTotal) + " of categorised sales in " + this.mon(cur.month, true) + ".";
    } else {
      driverBody = "No categorised sales in this period.";
    }

    const intelCards = [
      {
        kicker: "Value vs volume", iconColor: "#22C55E", iconBg: "rgba(34,197,94,.12)", iconBorder: "rgba(34,197,94,.35)",
        icon: "M4 20V10M10 20V4M16 20v-7M22 20H2",
        body: (function (self) {
          const uVs = prev && prev.units ? cur.units / prev.units - 1 : null;
          const cP = cur.units ? cur.value / cur.units : null, pP = prev && prev.units ? prev.value / prev.units : null;
          const pVs = cP && pP ? cP / pP - 1 : null;
          if (vsPrev == null) return "Value " + self.cur(cur.value) + " on " + self.num(cur.units) + " units — no comparable prior period in range.";
          return "Value moved " + self.pct(vsPrev) + " while units moved " + self.pct(uVs) + " — average unit price " + (pVs > 0 ? "improved " : "declined ") + self.bare(pVs) + " over " + periodLabel + ".";
        })(this)
      },
      {
        kicker: "Biggest driver", iconColor: "#ec6d25", iconBg: "rgba(236,109,37,.12)", iconBorder: "rgba(236,109,37,.4)",
        icon: "M7 17 17 7M17 7h-6M17 7v6",
        body: driverBody
      },
      {
        kicker: "Outlook", iconColor: "#5B9BD5", iconBg: "rgba(91,155,213,.12)", iconBorder: "rgba(91,155,213,.4)",
        icon: "M12 3a9 9 0 1 0 9 9h-9V3Z",
        body: "Six-month momentum is " + (v6 != null && v6 >= 0 ? "positive" : "negative") + " at " + this.pct(v6) + " for " + scopeLabel + "; " + this.mon(c1.month, true) + " sat " + this.pct(avg6 ? c1.value / avg6 - 1 : null) + " against its 6-month average."
      }
    ];

    /* focus items are derived from whatever the active slice can actually support */
    const monthName = (m) => this.mon(m, true);
    const scopedYoY = [];
    for (let i = lastComplete; i >= 12 && scopedYoY.length < 12; i--) {
      const ly = series[i - 12];
      if (ly && ly.value) scopedYoY.push({ month: series[i].month, vs: series[i].value / ly.value - 1, value: series[i].value });
    }
    const worstMonth = scopedYoY.slice().sort((a, z) => a.vs - z.vs)[0] || {};
    const bestMonth = scopedYoY.slice().sort((a, z) => z.vs - a.vs)[0] || {};

    /* category movers over the same 12 months — available whenever no client slice competes for it */
    const catMovers = (function (self) {
      const winMonths = series.slice(Math.max(0, lastComplete - 11), lastComplete + 1).map(r => r.month);
      const lyMonths = series.slice(Math.max(0, lastComplete - 23), Math.max(0, lastComplete - 11)).map(r => r.month);
      const curBy = {}, lyBy = {};
      d.category_monthly.forEach(r => {
        if (winMonths.indexOf(r.month) > -1) curBy[r.category] = (curBy[r.category] || 0) + r.sales_value;
        else if (lyMonths.indexOf(r.month) > -1) lyBy[r.category] = (lyBy[r.category] || 0) + r.sales_value;
      });

    })(this);

    const focusItems = [
