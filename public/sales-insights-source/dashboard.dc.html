<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
window.nexusInsightsApi = function(route, params) {
  if (!window.parent || window.parent === window) {
    return fetch("./mock-data/" + route.replace(/\//g, "_") + ".json").then(function(res) {
      if (!res.ok) throw new Error("mock route " + route + " not found");
      return res.json();
    });
  }
  return new Promise(function(resolve, reject) {
    var requestId = "si-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
    var timer = setTimeout(function() {
      window.removeEventListener("message", onMessage);
      reject(new Error("Nexus data bridge timed out on " + route));
    }, 180000);
    function onMessage(event) {
      var msg = event.data || {};
      if (msg.type !== "nexus-insights-api-response" || msg.requestId !== requestId) return;
      clearTimeout(timer);
      window.removeEventListener("message", onMessage);
      if (msg.ok) resolve(msg.data);
      else reject(new Error(msg.error || ("Nexus route failed: " + route)));
    }
    window.addEventListener("message", onMessage);
    window.parent.postMessage({ type: "nexus-insights-api", requestId: requestId, route: route, params: params || {} }, "*");
  });
};
</script>
<script src="./support.js"></script>
</head>

<!-- Non-blocking font load: measured 2026-08-21 that the plain <link rel="stylesheet">
     form was render-blocking and single-handedly responsible for ~3.4s of a 3.6s
     cold-load time (the 3.2MB data JSON itself fetches+parses in ~125ms and was
     never the bottleneck). preload+onload swap lets the page paint immediately with
     a system font, then swaps to Poppins once it arrives -- noscript keeps it working
     with JS disabled. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>

  .si-seg { display: inline-flex; background: #0D2137; border: 1px solid #1E3A52; border-radius: 9px; padding: 2px; gap: 2px; }
  .si-seg label { position: relative; display: inline-flex; align-items: center; padding: 5px 12px; font-size: 11px; font-weight: 500; letter-spacing: .04em; border-radius: 7px; color: #8DA2B5; cursor: pointer; white-space: nowrap; transition: background .12s ease, color .12s ease; }
  .si-seg label:hover { color: #f3f7fc; background: rgba(236,109,37,.10); }
  .si-seg label:has(input:checked) { color: #f3f7fc; background: rgba(236,109,37,.20); box-shadow: inset 0 0 0 1px rgba(236,109,37,.6); }
  .si-seg label:has(input:focus-visible) { outline: 2px solid #ec6d25; outline-offset: 1px; }
  .si-seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .si-ctl { height: 34px; width: 100%; padding: 0 12px; font-family: inherit; font-size: 12px; font-weight: 500; color: #D9E2EC; background: #0D2137; border: 1px solid #1E3A52; border-radius: 7px; outline: none; transition: border-color .12s ease, box-shadow .12s ease; }
  .si-ctl:hover { border-color: rgba(91,155,213,.45); }
  .si-ctl:focus-visible { border-color: rgba(236,109,37,.75); box-shadow: 0 0 0 3px rgba(236,109,37,.14); }
  select.si-ctl { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #8DA2B5 50%), linear-gradient(135deg, #8DA2B5 50%, transparent 50%); background-position: calc(100% - 15px) 15px, calc(100% - 10px) 15px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
  .si-label { display: block; font-size: 9px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #5f7d9a; margin-bottom: 6px; }
  .si-btn { height: 34px; padding: 0 14px; font-family: inherit; font-size: 11.5px; font-weight: 500; color: #f3f7fc; background: rgba(236,109,37,.12); border: 1px solid rgba(236,109,37,.45); border-radius: 7px; cursor: pointer; transition: background .12s ease, box-shadow .12s ease; }
  .si-btn:hover { background: rgba(236,109,37,.22); box-shadow: 0 2px 10px rgba(236,109,37,.14); }
  .si-btn:active { background: rgba(236,109,37,.32); }
  .si-btn:focus-visible { outline: 2px solid #ec6d25; outline-offset: 2px; }
  .si-btn-alt { background: rgba(91,155,213,.12); border: 1px solid rgba(91,155,213,.45); }
  .si-btn-alt:hover { background: rgba(91,155,213,.22); box-shadow: 0 2px 10px rgba(91,155,213,.14); }
  .si-panel { background: linear-gradient(165deg, rgba(24,66,114,.36), rgba(14,42,76,.30)); border: 1px solid rgba(38,78,124,.75); border-radius: 13px; box-shadow: 0 1px 0 rgba(157,196,236,.06) inset, 0 12px 28px -18px rgba(0,0,0,.55); transition: border-color .15s ease; }
  .si-kpi { border-left-width: 3px; border-left-style: solid; }
  .si-kpi:nth-child(6n+1) { border-left-color: #ec6d25; }
  .si-kpi:nth-child(6n+2) { border-left-color: #5B9BD5; }
  .si-kpi:nth-child(6n+3) { border-left-color: #22C55E; }
  .si-kpi:nth-child(6n+4) { border-left-color: #E8A838; }
  .si-kpi:nth-child(6n+5) { border-left-color: #D94F3A; }
  .si-kpi:nth-child(6n+6) { border-left-color: #9B8CDB; }
  .si-tile { background: rgba(11,34,58,.6); border: 1px solid rgba(38,78,124,.55); border-radius: 10px; box-shadow: 0 1px 0 rgba(157,196,236,.05) inset; }
  .si-row:hover { background: rgba(91,155,213,.10); }
  .si-hov:hover { background: rgba(157,196,236,.06); }
  .si-clk:hover { background: rgba(91,155,213,.09); box-shadow: inset 0 0 0 1px rgba(236,109,37,.32); }
  .si-hov .si-tip { opacity: 0; transition: opacity .12s ease; }
  .si-hov:hover .si-tip { opacity: 1; }
  ::selection { background: rgba(236,109,37,.32); }
  ::-webkit-scrollbar { height: 9px; width: 9px; }
  ::-webkit-scrollbar-thumb { background: #24507c; border-radius: 9px; }
  ::-webkit-scrollbar-thumb:hover { background: #2f628f; }
  .auth-spinner { width: 36px; height: 36px; margin: 0 auto 10px; border-radius: 50%; border: 3px solid rgba(236,109,37,.22); border-top-color: #ec6d25; animation: authSpin .8s linear infinite; }
  .auth-loading-box { display: none; margin-top: 16px; text-align: center; }
  .auth-loading-box.active { display: block; }
  .auth-loading-title { font-size: 13px; color: #ec6d25; font-weight: 700; margin-bottom: 4px; }
  .auth-loading-sub { font-size: 11px; color: #8DA2B5; font-weight: 500; line-height: 1.4; }
  @keyframes authSpin { to { transform: rotate(360deg); } }
  /* Nexus owns the workspace navigation. Keep this source file's dashboard surface,
     but remove its copied standalone rail when it is embedded in Nexus. */
  #si-dashboard-shell > aside { display: none !important; }
  #si-dashboard-shell > div { flex: 1 1 auto !important; min-width: 0; }
  #siSignOutLink { display: none !important; }
</style>

<!-- Sign-in overlay: plain DOM (not a DC-templated component), same pattern
     as the Inventory Dashboard's proven MSAL flow -- js hides this via
     siRevealDashboard() once handleRedirectPromise()/getAllAccounts() confirms
     a signed-in session. isLocalDev() never shows it at all (display:none
     inline below is overridden by nothing in local dev since siAuthReady
     resolves immediately and this element is simply left in the DOM,
     invisible behind the real dashboard which mounts underneath it --
     harmless, but if that bothers you it's safe to add
     `display: {{ isLocalDev() ? 'none' : 'flex' }}` here once the DC
     compiler's context makes that expression reachable from plain HTML). -->
<div id="siAuthOverlay" style="position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: #081b34; font-family: 'Poppins', system-ui, sans-serif">

    <div id="siAuthLoadingTitle" style="margin-top: 16px; font-size: 12.5px; color: #9dc4ec">Loading your dashboard...</div>
    <div id="siAuthError" style="font-size: 12px; color: #D94F3A; margin-top: 10px; min-height: 16px"></div>
  </div>
</div>

<script type="text/x-dc" data-dc-script data-props="{&quot;defaultMeasure&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Value&quot;,&quot;Units&quot;],&quot;default&quot;:&quot;Value&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;includePartialMonth&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;tableRows&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;min&quot;:10,&quot;max&quot;:100,&quot;step&quot;:10,&quot;tsType&quot;:&quot;number&quot;}}">
// =========================================================================
// MSAL sign-in -- ported from the Inventory Dashboard's proven, working
// flow (Meridian Nexus.dc.html), same tenant/app registration/API scope
// since both dashboards call the same backend Function App, just a
// different route/key. loginRedirect (not loginPopup) because popups
// auto-triggered without a user gesture get blocked by browsers -- this
// only ever fires from a real click on #signInBtn below. Skipped entirely
// on localhost/127.0.0.1 (isLocalDev), same convention as the rest of this
// file's API layer.
// =========================================================================
const SI_MSAL_CONFIG = {
  clientId: "2e19d14d-6914-4f52-8bbb-119481314eef",
  tenantId: "cbe83df2-b350-4dab-8d5f-f78d21fe7d27",
  // Hardcoded to the registered root URL -- NOT window.location.pathname.
  // This file's own URL ("Sales Insights Dashboard.dc.html") is NOT a
  // registered Azure AD redirect URI, only the login page's root URL is.
  // acquireTokenRedirect() in siGetApiToken() below (silent token refresh
  // failed) would otherwise throw AADSTS50011.
  redirectUri: "https://meridian-group-za.github.io/Sales-Insights/",
};
const SI_API_SCOPE = "api://878107a0-1dfb-4697-a7a1-615e47e9f67b/access_as_user";

function siIsLocalDev() {
  return window.parent === window && ["localhost", "127.0.0.1"].includes(window.location.hostname);
}

function siIsNexusEmbedded() {
  return window.parent && window.parent !== window;
}

let siResolveAuthReady;
const siAuthReady = new Promise((resolve) => { siResolveAuthReady = resolve; });

// Nexus owns authentication. The copied source may never redirect users to
// its retired Microsoft sign-in page; its only safe failsafe is to reveal the
// dashboard so the parent Firebase bridge can report any real data error.
let siFailsafeFired = false;
setTimeout(() => {
  const overlay = document.getElementById("siAuthOverlay");
  if (!overlay || overlay.style.display === "none") return;
  siFailsafeFired = true;
  siRevealDashboard();
}, 8000);

let siMsalInstance = null;
try {
  siMsalInstance = (siIsLocalDev() || siIsNexusEmbedded()) ? null : new msal.PublicClientApplication({
    auth: {
      clientId: SI_MSAL_CONFIG.clientId,
      authority: `https://login.microsoftonline.com/${SI_MSAL_CONFIG.tenantId}`,
      redirectUri: SI_MSAL_CONFIG.redirectUri,
    },
    cache: { cacheLocation: "localStorage" },
  });
} catch (e) {
  console.error("si-auth: failed to construct MSAL client:", e);
}

// This page never shows its own sign-in UI. If there's no session, bounce
// straight to the login page (index.html), which owns the actual
// custom-designed sign-in screen and the loginRedirect() call. This file
// only ever needs to confirm a session already exists.
const SI_LOGIN_URL = "https://meridian-group-za.github.io/Sales-Insights/";

function siSetAuthMessage(text) {
  const titleEl = document.getElementById("siAuthLoadingTitle");
  if (titleEl && text) titleEl.textContent = text;
}
function siRevealDashboard() {
  const overlay = document.getElementById("siAuthOverlay");
  if (overlay) overlay.style.display = "none";
  siResolveAuthReady();
}
function siGoToLogin() {
  siRevealDashboard();
}

document.addEventListener("click", (e) => {
  const link = e.target.closest && e.target.closest("#siSignOutLink");
  if (!link) return;
  e.preventDefault();
  if (siIsLocalDev() || siIsNexusEmbedded() || !siMsalInstance) { siRevealDashboard(); return; }
  siMsalInstance.logoutRedirect({ postLogoutRedirectUri: SI_LOGIN_URL });
});

if (siIsLocalDev() || siIsNexusEmbedded()) {
  siResolveAuthReady();
  const siOverlayEl = document.getElementById("siAuthOverlay");
  if (siOverlayEl) siOverlayEl.style.display = "none";
} else if (!siMsalInstance) {
  siGoToLogin();
} else {
  siMsalInstance.handleRedirectPromise().then((result) => {
    if (result || siMsalInstance.getAllAccounts().length > 0) {
      siSetAuthMessage("Loading your dashboard...");
      siRevealDashboard();
    } else {
      siGoToLogin();
    }
  }).catch((e) => {
    console.error("handleRedirectPromise error:", e);
    siGoToLogin();
  });
}

async function siGetApiToken() {
  const accounts = siMsalInstance.getAllAccounts();
  if (accounts.length === 0) throw new Error("Not signed in");
  try {
    const result = await siMsalInstance.acquireTokenSilent({ scopes: [SI_API_SCOPE], account: accounts[0] });
    return result.accessToken;
  } catch (e) {
    await siMsalInstance.acquireTokenRedirect({ scopes: [SI_API_SCOPE], account: accounts[0] });
    return null; // page will redirect -- never reaches here
  }
}

class Component extends DCLogic {
  mapRef = React.createRef();

  postMap() {
    const p = this._mapPayload;
    const f = this.mapRef.current;
    if (!p || !f || !f.contentWindow) return;
    f.contentWindow.postMessage(Object.assign({ type: "province-data" }, p), "*");
  }

  state = {
    d: null, err: "", page: "overview", yoyView: "monthly",
    measure: "value", includePartial: true,
    scopeMonth: "p12m", region: "all", zone: "all", category: "all", client: "all", brand: "all", product: "all",
    clientMenuOpen: false, categoryMenuOpen: false, regionMenuOpen: false, brandMenuOpen: false,
    dim: "region", top: "brands", signal: "growing",
    q: "", tier: "all", banner: "all", sort: "val", limit: 20,
    findingsOpen: false,
    loadingPage: false, loadedPages: {},
    // Store x client x product x region combination matrix (Carin,
    // 2026-08-21: "you must be able to select all filters and it must give
    // a result so we need all possibilities") -- separate filter state from
    // the Store league table above it, since store_matrix is a genuinely
    // different grain (store x client x product x region) from
    // store_performance (store x client only, no product). Also carries
    // the National Reporting Hierarchy levels (Head of Syndicated/General
    // Manager/Regional Manager/Manager), all stackable with the other four.
    mxStore: "", mxStoreQ: "", mxClient: "all", mxProduct: "all", mxRegion: "all",
    mxHos: "", mxGm: "", mxRm: "", mxMgr: "",
    mxRows: [], mxLoading: false, mxLoaded: false,
    hosOpts: [], gmOpts: [], rmOpts: [], mgrOpts: []
  };

  // ===========================================================================
  // Live API layer -- replaces the old single-fetch of a static
  // sales-insights-data.json blob (Carin, 2026-08-21: "i dont think we can
  // work on one big json file"). Every dataset now comes from its own live
  // sales_queries.py route, with real filter query params, mirroring the
  // MSAL+bearer-token pattern already drafted (unused) in the plain-JS
  // sibling C:\Users\CarinPillay\sales-insights-dashboard\index.html.
  //
  // Local dev (hostname localhost/127.0.0.1) skips MSAL entirely and hits
  // local_api_server.py directly with no auth -- same isLocalDev() bypass
  // convention as the other Meridian dashboards (see msal-auth.js). In
  // production, requests carry a bearer token acquired via MSAL against the
  // same clientId/tenantId/scope already registered for this app.
  // ===========================================================================
  // All dashboard data is supplied by the authenticated Nexus Firebase
  // bridge above. The former Azure API fallback was deliberately removed.

  isLocalDev() {
    return siIsLocalDev();
  }

  // Fetches one live route (e.g. "summary", "dimension_breakdown") with an
  // optional {param: value} object turned into a real querystring. Every
  // filter dropdown ultimately calls this (directly or via loadPage) so the
  // numbers on screen come from the server's own filtered query, not a
  // client-side .filter() over a static blob.
  async apiFetch(route, params) {
    if (window.nexusInsightsApi) return window.nexusInsightsApi(route, params);
    const qs = params && Object.keys(params).length
      ? "?" + Object.entries(params).filter(([, v]) => v != null && v !== "" && v !== "all")
          .map(([k, v]) => encodeURIComponent(k) + "=" + encodeURIComponent(v)).join("&")
      : "";
    throw new Error("Sales Insights must be opened from the Nexus Firebase workspace.");
  }

  // Routes needed to render the Executive Overview (default landing page)
  // plus every filter dropdown's option list (region/category/client/brand/
  // product all get their choices from live dimension routes, not a big
  // export). Everything else is lazy-fetched by loadPage() the first time a
  // page is actually opened.
  async loadCore() {
    const [meta, summary, kpi_cards, monthly_trend, category_monthly, categories, brands, regions,
           products, client_monthly, dimension_region, insights_brands,
           declining, growing, at_risk, bucket_summary, banner_bucket_summary, province_monthly,
           dimension_banner_eager, brand_categories, zones] = await Promise.all([
      this.apiFetch("meta"), this.apiFetch("summary"), this.apiFetch("kpi_cards"),
      this.apiFetch("monthly_trend"), this.apiFetch("category_monthly"), this.apiFetch("categories"),
      this.apiFetch("brands"), this.apiFetch("regions"), this.apiFetch("products"),
      this.apiFetch("client_monthly"), this.apiFetch("dimension_breakdown", { dimension: "region" }),
      this.apiFetch("insights/brands"),
      this.apiFetch("insights/stores", { type: "declining" }), this.apiFetch("insights/stores", { type: "growing" }),
      this.apiFetch("insights/stores", { type: "at_risk" }), this.apiFetch("bucket_summary"),
      this.apiFetch("banner_bucket_summary"),
      // Needed eagerly (not lazy like the rest of the Regions page's data)
      // because the GLOBAL region filter dropdown -- shown in the header on
      // every page, not just Regions -- cross-checks get_regions() against
      // this to drop junk values. Confirmed 2026-08-22: leaving this lazy
      // meant the region filter was permanently stuck on "All regions"
      // only, with zero other options, on every page, until (and unless)
      // the user happened to visit the Regions page first.
      this.apiFetch("province_monthly"),
      // Same bug, same fix, for the global Retailer/banner filter -- it
      // used to read d.store_performance (lazy, Stores-page-only), so it
      // was stuck on "All retailers" everywhere until Stores had loaded.
      this.apiFetch("dimension_breakdown", { dimension: "banner" }),
      // (brand, category) pairing so the Brand filter's own option list can
      // cascade off the Category filter -- see brandOpts below.
      this.apiFetch("brand_categories"),
      // Distinct Inland/Coastal/Central values for the new Zone filter
      // (National Reporting Hierarchy's Division column) -- same eager
      // pattern as regions/banners above so it's populated everywhere.
      this.apiFetch("hierarchy_levels", { level: "zone" }),
    ]);
    return {
      meta, summary, kpi_cards, monthly_trend, category_monthly, categories, brands, regions, products,
      client_monthly, dimension_region, insights_brands,
      insights_stores_declining: declining, insights_stores_growing: growing, insights_stores_at_risk: at_risk,
      bucket_summary, banner_bucket_summary, province_monthly,
      dimension_banner_eager, brand_categories, zones,
      // Placeholders for lazy-loaded, page-specific datasets -- filled in by
      // loadPage() on first visit to the page that needs them. Kept as
      // empty-but-well-shaped defaults (not undefined) so renderVals's
      // derivations, which run for every page every render, don't throw
      // before that page has ever been opened.
      dimension_brand: { rows: [], latest_month: null },
      dimension_banner: { rows: [], latest_month: null }, brand_monthly: [], banner_monthly: [],
      store_performance: [], store_count: null, product_detail: { rows: [], latest_month: null, network_stores_latest: null },
      price_mix: { monthly: [], by_retailer: [] },
      price_volume_bridge: { volume: 0, mix: 0, price: 0, net_change: 0, latest_month: null, prior_month: null },
      client_product_crosstab: { rows: [] }, region_crosstab: { by: "brand", rows: [], latest_month: null },
    };
  }

  // Extra routes each page needs beyond loadCore()'s startup set, fetched
  // once (cached by loadedPages) the first time that page is actually
  // opened -- e.g. `if (key === 'store' && !storePerfLoaded) loadStorePerformance();`
  // pattern from the plain-JS sibling index.html, adapted to this
  // component's own page/state names. Re-fetches instead when the filters a
  // page's data depends on change (see loadPage's callers in the filter
  // setters below).
  async loadPage(page, opts) {
    opts = opts || {};
    const params = { client: this.state.client, category: this.state.category, brand: this.state.brand,
      region: this.state.region, zone: this.state.zone, banner: this.state.banner, product: this.state.product };
    const patch = {};
    // Sequence guard against out-of-order responses -- confirmed 2026-08-22:
    // navigating to a page (unfiltered fetch) then immediately changing a
    // filter (refetchCurrentPage -> a second, filtered fetch for the same
    // page) can resolve in either order depending on server timing. Without
    // this, whichever call happens to finish LAST wins the setState merge
    // regardless of which one was issued last, so a slow first/unfiltered
    // response can silently overwrite a fast filtered one and leave the
    // Regions page map/headline showing network-wide totals under a client
    // filter (looked identical to "filters don't work" but the data really
    // did come back correct -- it just lost the race). this._loadSeq is a
    // per-page counter; only the highest-numbered call for a given page is
    // allowed to commit its patch.
    this._loadSeq = this._loadSeq || {};
    const seq = (this._loadSeq[page] = (this._loadSeq[page] || 0) + 1);
    try {
      if (page === "overview" || page === "trend") {
        const [summary, kpi_cards, monthly_trend, category_monthly, bucket_summary, banner_bucket_summary] = await Promise.all([
          this.apiFetch("summary", params), this.apiFetch("kpi_cards", params),
          this.apiFetch("monthly_trend", params),
          this.apiFetch("category_monthly", { client: params.client, brand: params.brand }),
          // bucket_summary/banner_bucket_summary now support the full filter
          // set server-side (category/brand/region/zone, not just client) --
          // this only ever forwarded `client`, so the Value/Volume Share by
          // product bucket widget and the Channel types table never reacted
          // to any other filter. Fixed 2026-08-22.
          this.apiFetch("bucket_summary", params),
          this.apiFetch("banner_bucket_summary", params),
        ]);
        Object.assign(patch, { summary, kpi_cards, monthly_trend, category_monthly, bucket_summary, banner_bucket_summary });
      } else if (page === "regions") {
        const [dr, db, region_crosstab, province_monthly] = await Promise.all([
          this.apiFetch("dimension_breakdown", Object.assign({ dimension: "region" }, params)),
          this.apiFetch("dimension_breakdown", Object.assign({ dimension: "banner" }, params)),
          this.apiFetch("region_crosstab", { by: "brand", client: this.state.client }),
          this.apiFetch("province_monthly", { client: this.state.client === "all" ? null : this.state.client,
            category: this.state.category === "all" ? null : this.state.category,
            brand: this.state.brand === "all" ? null : this.state.brand,
            zone: this.state.zone === "all" ? null : this.state.zone,
            product: this.state.product === "all" ? null : this.state.product }),
        ]);
        Object.assign(patch, { dimension_region: dr, dimension_banner: db, region_crosstab, province_monthly });
      } else if (page === "brands" || page === "channels") {
        const [dr, db] = await Promise.all([
          this.apiFetch("dimension_breakdown", Object.assign({ dimension: "brand" }, params)),
          this.apiFetch("dimension_breakdown", Object.assign({ dimension: "banner" }, params)),
        ]);
        const [bm, bnm] = await Promise.all([
          this.apiFetch("brand_monthly", params), this.apiFetch("banner_monthly", params),
        ]);
        Object.assign(patch, { dimension_brand: dr, dimension_banner: db, brand_monthly: bm, banner_monthly: bnm });
      } else if (page === "productlist" || page === "products") {
        // "products" (S.page) is actually the Categories page (see
        // pageTitle: products -> "Category Performance") -- its
        // categoryRows/mixBlocks/etc all derive from d.category_monthly
        // (see renderVals, ~line 3939/4011), which this branch never
        // fetched before: it only ever pulled product_detail/
        // client_product_crosstab, meant for the separate "productlist"
        // (Product Performance) page that shares this branch. That left
        // category_monthly stuck on whatever loadCore()/the overview
        // branch last populated it with (unscoped, or scoped only by
        // client+brand) -- so the Categories page silently never reacted
        // to ANY header filter. Fixed 2026-08-22 by also refetching
        // category_monthly here, scoped by every filter that applies to
        // it (client/brand/region -- category itself doesn't apply, this
        // IS the category breakdown).
        const [pd, cpx, category_monthly] = await Promise.all([
          this.apiFetch("product_detail", Object.assign({ limit: 300 }, params)),
          this.apiFetch("client_product_crosstab", { client: this.state.client === "all" ? null : this.state.client, top: 100 }),
          this.apiFetch("category_monthly", { client: params.client, brand: params.brand, region: params.region }),
        ]);
        Object.assign(patch, { product_detail: pd, client_product_crosstab: cpx, category_monthly });
      } else if (page === "stores") {
        const [sp, hos, gm, rm, mgr, sc] = await Promise.all([
          // Raised from 500 -- confirmed 2026-08-22 there are 6,741 distinct
          // trading stores in the real DB, so 500 silently truncated the
          // "Trading stores" count/list. get_store_performance already
          // pre-aggregates via ranked CTEs (not a raw row-grain scan), so an
          // uncapped-in-practice limit still returned in ~3s against the
          // real sales.duckdb -- comfortably inside the <10s budget.
          this.apiFetch("store_performance", Object.assign({ limit: 8000 }, params)),
          this.apiFetch("hierarchy_levels", { level: "head_of_syndicated" }),
          this.apiFetch("hierarchy_levels", { level: "general_manager" }),
          this.apiFetch("hierarchy_levels", { level: "regional_manager" }),
          this.apiFetch("hierarchy_levels", { level: "manager" }),
          // Store x client pairs (55,738 of them) far exceed the 8000 row
          // cap above, so "Trading stores" was just displaying that cap
          // back verbatim (a suspiciously round "8 000") instead of a real
          // count -- this is a genuine count query, unaffected by the cap.
          this.apiFetch("store_count", { region: params.region, banner: this.state.banner, zone: params.zone }),
        ]);
        Object.assign(patch, { store_performance: sp, store_count: sc.stores });
        this.setState({ hosOpts: hos, gmOpts: gm, rmOpts: rm, mgrOpts: mgr });
        // Store x client x product x region matrix widget removed
        // 2026-08-22 (Carin: "take this out it doesn't work") -- no longer
        // calling loadStoreMatrix() here, so this page no longer triggers
        // that live full-table-scan at all.
      } else if (page === "pricemix") {
        const [pm, pvb] = await Promise.all([
          this.apiFetch("price_mix", params),
          this.apiFetch("price_volume_bridge", params),
        ]);
        Object.assign(patch, { price_mix: pm, price_volume_bridge: pvb });
      } else {
        return; // overview/trend need nothing beyond loadCore()
      }
      if (this._loadSeq[page] !== seq) return; // a newer request for this page already landed
      this.setState(s => ({ d: Object.assign({}, s.d, patch), loadingPage: false,
        loadedPages: Object.assign({}, s.loadedPages, { [page]: true }) }));
    } catch (e) {
      console.error("loadPage failed:", page, e);
      if (this._loadSeq[page] === seq) this.setState({ loadingPage: false });
    }
  }

  // Live-refetches the store x client x product x region combination
  // matrix (get_store_matrix) with whatever subset of its 8 possible
  // filters (store/client/product/region/head_of_syndicated/
  // general_manager/regional_manager/manager) is currently set -- every
  // one is optional and they all stack, matching the backend's own
  // "all possible combinations" contract.
  async loadStoreMatrix() {
    const S = this.state;
    // Verification (2026-08-22, local_api_server against the real
    // sales.duckdb) found get_store_matrix scans sales_fact at full row
    // grain and takes 30s+ with ZERO filters applied -- it has no
    // pre-aggregated fallback (see its docstring). The Stores page used to
    // call this unconditionally on mount with every mx* filter empty,
    // which is exactly the "10+ second load" the combination matrix must
    // never cause. Skip the fetch until the user has picked at least one
    // filter; the table shows a prompt instead (see render, mxRows.length
    // === 0 && !mxLoaded case).
    const anyMxFilter = S.mxStore || (S.mxClient && S.mxClient !== "all") ||
      (S.mxProduct && S.mxProduct !== "all") || (S.mxRegion && S.mxRegion !== "all") ||
      S.mxHos || S.mxGm || S.mxRm || S.mxMgr;
    if (!anyMxFilter) {
      this.setState({ mxRows: [], mxLoading: false, mxLoaded: false });
      return;
    }
    this.setState({ mxLoading: true });
    try {
      const rows = await this.apiFetch("store_matrix", {
        store: S.mxStore || null, client: S.mxClient === "all" ? null : S.mxClient,
        product: S.mxProduct === "all" ? null : S.mxProduct, region: S.mxRegion === "all" ? null : S.mxRegion,
        head_of_syndicated: S.mxHos || null, general_manager: S.mxGm || null,
        regional_manager: S.mxRm || null, manager: S.mxMgr || null, limit: 200,
      });
      this.setState({ mxRows: rows.rows || [], mxLoading: false, mxLoaded: true });
    } catch (e) {
      console.error("loadStoreMatrix failed:", e);
      this.setState({ mxLoading: false });
    }
  }

  setMx(field) {
    return (e) => this.setState({ [field]: e.target.value }, () => this.loadStoreMatrix());
  }

  // Type-to-search store picker (replaced the 8000-option plain <select>,
  // 2026-08-22): the <input list=...> datalist gives back whatever text the
  // user typed/picked, which is the display LABEL (title-cased), not the
  // raw store name the backend filters on -- resolve it back to the real
  // key here, same idea as the Store league table's existing stQ search.
  setMxStoreQ(e) {
    const q = e.target.value;
    // mxStoreOpts itself only exists as a computed render value (built
    // fresh from d.store_performance in renderVals), not real component
    // state, so it can't be read back here -- rebuild the same key<->label
    // mapping directly off the raw data instead.
    const d = this.state.d;
    const match = d && d.store_performance ? d.store_performance.find(r => this.title(r.store_name) === q) : null;
    this.setState({ mxStoreQ: q, mxStore: match ? match.store_name : "" }, () => this.loadStoreMatrix());
  }

  // Client multi-select (2026-08-22): `client` state stays a plain string
  // -- "all", one client, or several comma-joined -- so every existing
  // reader of S.client (the header meta line, resetFilters, etc.) keeps
  // working untouched. apiFetch already sends it through unchanged; the
  // backend's _client_where now splits on comma and builds an IN(...).
  toggleClientMenu() {
    this.setState(s => ({ clientMenuOpen: !s.clientMenuOpen }));
  }

  setClientAll() {
    this.setState({ client: "all", clientMenuOpen: false, brand: "all", category: "all", product: "all" },
      () => { this.refetchCurrentPage(); this.refetchFilterOptions(); });
  }

  toggleClientOne(name) {
    const current = this.state.client === "all" ? [] : this.state.client.split(",").filter(Boolean);
    const next = current.includes(name) ? current.filter(c => c !== name) : current.concat([name]);
    this.setState({ client: next.length ? next.join(",") : "all", brand: "all", category: "all", product: "all" },
      () => { this.refetchCurrentPage(); this.refetchFilterOptions(); });
  }

  // Generic multi-select toggle for a plain "all"-or-comma-list filter
  // field (Category/Region) -- Client has its own version above since it
  // also resets brand/category/product and calls refetchFilterOptions.
  toggleMultiMenu(menuField) {
    this.setState(s => ({ [menuField]: !s[menuField] }));
  }

  setMultiAll(field, menuField) {
    this.setState({ [field]: "all", [menuField]: false }, () => this.refetchCurrentPage());
  }

  toggleMultiOne(field, value) {
    const current = this.state[field] === "all" ? [] : this.state[field].split(",").filter(Boolean);
    const next = current.includes(value) ? current.filter(v => v !== value) : current.concat([value]);
    this.setState({ [field]: next.length ? next.join(",") : "all" }, () => this.refetchCurrentPage());
  }

  // Called from nav clicks and from filter onChange handlers that affect a
  // page whose data already loaded once -- refetches with the new filter
  // value instead of leaving the page showing stale/unfiltered numbers.
  gotoPage(page) {
    // loadCore already contains every Executive Overview dataset. The outer
    // Nexus menu sends an initial "overview" message after the iframe loads;
    // fetching it again here doubled the most expensive startup queries.
    if (page === "overview") { this.setState({ page }); return; }
    if (this.state.loadedPages[page]) { this.setState({ page }); return; }
    this.setState({ page, loadingPage: true });
    this.loadPage(page);
  }

  refetchCurrentPage() {
    this.setState({ loadingPage: true });
    this.loadPage(this.state.page);
  }

  componentDidMount() {
    // The overlay div is plain static markup rendered by the DC template,
    // not mounted until AFTER this component's script block has already
    // run -- an earlier attempt to hide it from that top-level script (at
    // module-evaluation time, before mount) silently no-op'd because
    // getElementById found nothing yet. componentDidMount is guaranteed to
    // fire after mount, so this is the reliable place.
    if (this.isLocalDev() || siIsNexusEmbedded()) {
      const overlayEl = document.getElementById("siAuthOverlay");
      if (overlayEl) overlayEl.style.display = "none";
    }
    this._onMsg = (e) => {
      if (!e.data) return;
      if (e.data.type === "nexus-insights-nav" && e.data.page) {
        this.gotoPage(e.data.page);
        window.scrollTo(0, 0);
        return;
      }
      if (e.data.type === "province-map-ready") this.postMap();
      if (e.data.type === "province-click" && e.data.keys && e.data.keys.length) {
        const k = e.data.keys[0];
        this.setState({ region: this.state.region === k ? "all" : k }, () => this.refetchCurrentPage());
      }
    };
    window.addEventListener("message", this._onMsg);
    (async () => {
      try {
        await siAuthReady; // resolves immediately in local dev; waits for a real sign-in in production
        const d = await this.loadCore();
        // Merge (not replace) -- confirmed 2026-08-22: if the user clicks a
        // nav link while loadCore() is still in flight (a real possibility,
        // it's the slowest fetch on the page since it eager-loads every
        // filter dropdown's option list), that page's loadPage() can finish
        // first and merge its own patch into state.d, only for loadCore's
        // later completion to blow the whole d object away with a plain
        // `d:` replace -- wiping the page's just-loaded data back to
        // loadCore's own (page-specific-data-less) defaults. Looked exactly
        // like "the Stores page came back completely empty" despite the API
        // genuinely returning full data moments earlier.
        this.setState(s => ({
          d: Object.assign({}, d, s.d),
          measure: this.props.defaultMeasure === "Units" ? "units" : "value",
          includePartial: this.props.includePartialMonth ?? true,
          limit: this.props.tableRows ?? 20
        }));
      } catch (e) {
        console.error("loadCore failed:", e);
        this.setState({ err: this.isLocalDev()
          ? "Could not reach local_api_server.py on port 8792 — start it and reload."
          : "Could not load live sales data — sign-in or API error: " + e.message });
      }
    })();
  }

  cur(v) {
    if (v == null || !isFinite(v)) return "—";
    const a = Math.abs(v), sign = v < 0 ? "−" : "";
    if (a >= 1e9) return sign + "R" + (a / 1e9).toFixed(2) + "bn";
    if (a >= 1e6) return sign + "R" + (a / 1e6).toFixed(1) + "m";
    if (a >= 1e3) return sign + "R" + (a / 1e3).toFixed(0) + "k";
    return sign + "R" + a.toFixed(2);
  }
  num(v) {
    if (v == null || !isFinite(v)) return "—";
    const a = Math.abs(v), sign = v < 0 ? "−" : "";
    if (a >= 1e9) return sign + (a / 1e9).toFixed(2) + "bn";
    if (a >= 1e6) return sign + (a / 1e6).toFixed(2) + "m";
    if (a >= 1e3) return sign + (a / 1e3).toFixed(1) + "k";
    return sign + Math.round(a).toLocaleString("en-ZA");
  }
  int(v) { return v == null ? "—" : Math.round(v).toLocaleString("en-ZA").replace(/,/g, " "); }
  pct(v, dp) {
    if (v == null || !isFinite(v)) return "—";
    const p = v * 100;
    return (p > 0 ? "+" : p < 0 ? "−" : "") + Math.abs(p).toFixed(dp == null ? 1 : dp) + "%";
  }
  bare(v, dp) { return v == null || !isFinite(v) ? "—" : Math.abs(v * 100).toFixed(dp == null ? 1 : dp) + "%"; }
  pp(v) { return v == null || !isFinite(v) ? "—" : (v > 0 ? "+" : "−") + Math.abs(v * 100).toFixed(1) + "pp"; }
  tone(v) { return v == null || !isFinite(v) || v === 0 ? "#8DA2B5" : v > 0 ? "#22C55E" : "#D94F3A"; }
  title(s) { return String(s == null ? "" : s).toLowerCase().replace(/\b\w/g, c => c.toUpperCase()); }
  mon(s, long) {
    if (!s) return "";
    const m = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    return m[parseInt(s.slice(5, 7), 10) - 1] + " " + (long ? s.slice(0, 4) : s.slice(2, 4));
  }
  path(vals, w, h) {
    if (!vals || !vals.length) return "";
    const lo = Math.min(...vals), hi = Math.max(...vals), sp = hi - lo || 1;
    return vals.map((v, i) => {
      const x = vals.length === 1 ? 0 : (i / (vals.length - 1)) * w;
      const y = h - 2 - ((v - lo) / sp) * (h - 4);
      return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    }).join(" ");
  }

    // (brand, category) pairing from get_brand_categories (d.brand_categories,
    // also eager in loadCore) -- d.brands itself has no category dimension.
    const brandSource = S.category === "all"
      ? d.brands
      : (() => {
          const agg = {};
          (d.brand_categories || []).forEach(r => {
            if (r.category !== S.category) return;
            agg[r.brand] = (agg[r.brand] || 0) + (r.sales_value || 0);
          });
          return Object.keys(agg).map(brand => ({ brand, sales_value: agg[brand] }));
        })();
    const brandOpts = [{ key: "all", label: "All brands" }]
      .concat(brandSource.slice().sort((a, z) => z.sales_value - a.sales_value).slice(0, 150).map(r => ({ key: r.brand, label: this.title(r.brand) })));
    const productOpts = [{ key: "all", label: "All products" }]
      .concat(d.products.filter(p => p.product && String(p.product).toLowerCase() !== "nan").slice(0, 150).map(p => ({ key: p.product, label: this.title(p.product) })));
    const brandMulti = multiSnapshot("brand", brandOpts, "All brands");

    /* scoped series */
    // series comes straight from d.monthly_trend, which is already fetched
    // WITH the full filter set (client/category/region/brand/zone/product)
    // applied server-side (get_monthly_trend, fixed to a live sales_fact
    // scan for exactly this reason). This used to re-derive series
    // client-side by filtering category_monthly/client_monthly/
    // province_monthly on an EXACT raw-text match (r.category === S.category)
    // -- broken two ways, confirmed 2026-08-22: (1) raw category/client/
    // region text has inconsistent casing ("Feminine Hygiene" vs "FEMININE
    // HYGIENE"), so months where only the differently-cased variant existed
    // silently zeroed out even though the real data was right there in
    // monthly_trend; (2) S.category/S.client/S.region can now be a
    // comma-joined multi-select list, which an exact `===` never matches at
    // all. Removed entirely rather than patched -- monthly_trend already
    // handles all of this correctly and combined (e.g. category + region
    // together), which this client-side version never could anyway.
    let series = d.monthly_trend.map(m => ({ month: m.month, value: m.sales_value, units: m.sales_units }));
    let scopeLabel = "All clients";
    const notes = [];
    scopeLabel = [
      S.client !== "all" ? clientMenuLabel : null,
      S.category !== "all" ? categoryMulti.menuLabel : null,
      S.region !== "all" ? regionMulti.menuLabel : null,
      S.brand !== "all" ? brandMulti.menuLabel : null,
      S.product !== "all" ? this.title(S.product) : null
    ].filter(Boolean).join(" · ") || "All clients";

    /* brand and product have no monthly split — they drive the 12-month comparison */
    const brandRow = S.brand === "all" ? null : d.dimension_brand.rows.find(r => r.dim === S.brand);
    const productRow = S.product === "all" ? null : d.products.find(p => p.product === S.product);
    if (brandRow) notes.push(this.title(S.brand) + ": " + this.cur(brandRow.cur_value) + " rolling 12m, " + this.pct(brandRow.value_vs_pct) + " on prior year — brand has no monthly split in this extract, so the charts stay on the wider slice.");
    if (productRow) notes.push(this.title(S.product) + ": " + this.cur(productRow.sales_value) + " total recorded value — product-level monthly data is not in this extract.");
    const rollN = { p3m: 3, p6m: 6, p12m: 12 }[S.scopeMonth] || 0;
    const sliced = S.region !== "all" || S.category !== "all";
    const scoped = sliced || S.scopeMonth !== "latest";

    const sum = (arr, k) => arr.reduce((a, r) => a + r[k], 0);
    let idx, cur, prev, vsPrev, periodLabel, prevLabel;
    if (rollN) {
      /* rolling windows end on the last COMPLETE month so a part-month can't distort them */
      const endIdx = partial ? series.length - 2 : series.length - 1;
      idx = endIdx;
      const win = series.slice(Math.max(0, endIdx - rollN + 1), endIdx + 1);
      const pWin = series.slice(Math.max(0, endIdx - rollN * 2 + 1), Math.max(0, endIdx - rollN + 1));
      cur = { month: series[endIdx].month, value: sum(win, "value"), units: sum(win, "units") };
      prev = pWin.length ? { month: pWin[0].month, value: sum(pWin, "value"), units: sum(pWin, "units") } : null;
      vsPrev = prev && prev.value ? cur.value / prev.value - 1 : null;
      periodLabel = "the " + rollN + " months to " + this.mon(series[endIdx].month, true);
      prevLabel = "vs prior " + rollN + " months";
    } else {
      idx = S.scopeMonth === "latest" ? series.length - 1
        : S.scopeMonth === "prev" ? series.length - 2
        : Math.max(0, monthsAll.indexOf(S.scopeMonth));
      cur = series[idx];
      prev = series[idx - 1];
      vsPrev = prev && cur && prev.value ? cur.value / prev.value - 1 : null;
      // cur can be undefined when the current filter combination has no
      // rows in monthly_trend at all (e.g. a category/brand/region
      // intersection with zero sales) -- this used to throw and take the
      // ENTIRE page down with it (every {{ }} binding on the page would
      // then show as "never resolved"), not just this one widget.
      periodLabel = cur ? (this.mon(cur.month, true) + (cur.month === latest && partial ? " MTD" : "")) : "No data for this selection";
      prevLabel = prev ? "vs " + this.mon(prev.month) : "no prior month";
      // Everything below this point in renderVals assumes cur/prev are real
      // { month, value, units } objects -- rather than null-guard every one
      // of those dozens of downstream reads, substitute a real zero-value
      // stand-in here so the rest of the page still renders (as all-zero)
      // instead of crashing outright when a filter combination has no data.
      if (!cur) cur = { month: latest, value: 0, units: 0 };
      if (!prev) prev = { month: null, value: 0, units: 0 };
    }

    /* KPI cards */
    const window12 = (k) => series.slice(Math.max(0, idx - 11), idx + 1).map(r => r[k]);
    let kpis;
    if (!scoped) {
      kpis = d.kpi_cards.cards.map(c => {
        const up = c.vs_prev_pct > 0;
        const isCount = c.key === "stores";
        return {
          label: c.label,
          value: c.key === "avg_price" ? "R" + c.value.toFixed(2)
            : isCount ? this.int(c.value)
            : (c.format === "currency" ? this.cur(c.value) : this.num(c.value)),
          showPill: true, arrow: up ? "▲" : "▼", delta: this.bare(c.vs_prev_pct),
          deltaNote: "vs " + prevMonthLabel,
          color: this.tone(c.vs_prev_pct), pillBg: up ? "rgba(34,197,94,.12)" : "rgba(217,79,58,.12)",
          line: this.path(c.trend, 220, 40)
        };
      });
    } else {
      const vS = window12("value"), uS = window12("units");
      const pS = vS.map((v, i) => uS[i] ? v / uS[i] : 0);
      const curP = cur.units ? cur.value / cur.units : null;
      const prevP = prev && prev.units ? prev.value / prev.units : null;
      const mk = (label, value, vs, spark, note) => {
        const up = vs != null && vs > 0;
        return {
          label, value, showPill: vs != null, arrow: up ? "▲" : "▼", delta: this.bare(vs),
          deltaNote: note || prevLabel,
          color: this.tone(vs), pillBg: vs == null ? "rgba(91,155,213,.12)" : up ? "rgba(34,197,94,.12)" : "rgba(217,79,58,.12)",
          line: this.path(spark, 220, 40)
        };
      };
      /* share of the un-filtered business over the same window */
      const totalSeries = d.monthly_trend.map(m => ({ value: m.sales_value }));
      const totalWindow = rollN
        ? sum(totalSeries.slice(Math.max(0, idx - rollN + 1), idx + 1), "value")
        : (d.monthly_trend[idx] ? d.monthly_trend[idx].sales_value : null);
      const months = rollN || 1;
      kpis = [
        mk("Net sales", this.cur(cur.value), vsPrev, vS),
        mk("Units sold", this.num(cur.units), prev && prev.units ? cur.units / prev.units - 1 : null, uS),
        mk("Avg unit price", curP ? "R" + curP.toFixed(2) : "—", prevP ? curP / prevP - 1 : null, pS),
        mk("Avg per month", this.cur(cur.value / months), null, vS, rollN ? "average over " + rollN + " months" : "single month"),
        sliced
          ? mk("Share of all sales", this.bare(totalWindow ? cur.value / totalWindow : null), null, vS, "of total, same window")
          : (function (self) {
              const sc = d.kpi_cards.cards.find(c => c.key === "stores") || {};
              const card = mk("Stores Trading", self.int(sc.value), sc.vs_prev_pct, sc.trend, "vs " + prevMonthLabel);
              return card;
            })(this)
      ];
    }

    /* rolling strip — computed from the scoped series so it follows the filters */
    const lastComplete = partial ? series.length - 2 : series.length - 1;
    const winSum = (endIdx, n, k) => series.slice(Math.max(0, endIdx - n + 1), endIdx + 1).reduce((a, r) => a + (r[k] || 0), 0);
    const winVsYear = (n, k) => {
      const c = winSum(lastComplete, n, k), p = winSum(lastComplete - 12, n, k);
      return p ? c / p - 1 : null;
    };
    const rolling = [
      { label: "MTD", window: this.mon(latest, true), n: 0 },
      { label: "3M", window: "rolling 3 months", n: 3 },
      { label: "6M", window: "rolling 6 months", n: 6 },
      { label: "12M", window: "rolling 12 months", n: 12 }
    ].map(r => {
      if (!r.n) {
        const m = series[series.length - 1], ly = series[series.length - 13];
        const vs = ly && ly.value ? m.value / ly.value - 1 : null;
        return { label: r.label, window: r.window, value: this.cur(m.value), units: this.num(m.units) + " units", vs: this.pct(vs), color: this.tone(vs) };
      }
      const v = winSum(lastComplete, r.n, "value"), u = winSum(lastComplete, r.n, "units"), vs = winVsYear(r.n, "value");
      return { label: r.label, window: r.window, value: this.cur(v), units: this.num(u) + " units", vs: this.pct(vs), color: this.tone(vs) };
    });

    /* trend */
    const ms = S.includePartial ? series : series.filter(r => r.month !== latest);
    const vals = ms.map(r => isVal ? r.value : r.units);
    const hi = Math.max(...vals, 1);
    const L = 52, H = 250, gap = 4, bw = (1000 - L - gap * (ms.length - 1)) / ms.length;
    const trendBars = ms.map((r, i) => {
      const h = Math.max(1, (vals[i] / hi) * H);
      return { x: (L + i * (bw + gap)).toFixed(1), w: bw.toFixed(1), y: (H - h + 10).toFixed(1), h: h.toFixed(1), fill: r.month === latest && partial ? "rgba(236,109,37,.42)" : "#ec6d25" };
    });
    const trendGrid = [0, 0.25, 0.5, 0.75, 1].map(f => {
      const y = 10 + H - f * H;
      return { y: y.toFixed(1), ty: (y - 4).toFixed(1), label: isVal ? this.cur(hi * f) : this.num(hi * f) };
    });
    const trendAvgLine = vals.map((v, i) => {
      const w = vals.slice(Math.max(0, i - 2), i + 1);
      const a = w.reduce((x, y) => x + y, 0) / w.length;
      return (i ? "L" : "M") + (L + i * (bw + gap) + bw / 2).toFixed(1) + " " + (10 + H - (a / hi) * H).toFixed(1);
    }).join(" ");
    const every = Math.ceil(ms.length / 7);
    const trendTicks = ms.filter((m, i) => i % every === 0).map(m => this.mon(m.month));

    /* 12-month value & volume charts, current period vs prior year */
    const endI = partial ? series.length - 2 : series.length - 1;
    const cur12 = series.slice(Math.max(0, endI - 11), endI + 1);
    const ly12 = series.slice(Math.max(0, endI - 23), Math.max(0, endI - 11));
    const sharePalette = ["#ec6d25", "#f2955c", "#5B9BD5", "#3B82F6", "#9dc4ec", "#4A6B8A"];
    const mkShare = (title, rows, byValue) => ({
      title,
      segs: rows.map((r, i) => {
        const share = byValue ? r.val_12m_share : r.vol_12m_share;
        const vs = byValue ? r.val_12m_vs_pp : r.vol_12m_vs_pp;
        return {
          label: r.bucket, fill: sharePalette[i % sharePalette.length],
          w: (share * 100).toFixed(1) + "%", share: (share * 100).toFixed(1) + "%",
          vs: this.pct(vs), color: this.tone(vs),
          tip: r.bucket + " — " + (byValue ? this.cur(r.val_12m) : this.num(r.vol_12m) + " units") + " (12m)"
        };
      })
    });
    const mkChart = (title, key, fmt) => {
      const cv = cur12.map(r => r[key]), lv = ly12.map(r => r[key]);
      const all = cv.concat(lv.length ? lv : cv);
      const lo0 = Math.min(...all), hi0 = Math.max(...all);
      const padv = (hi0 - lo0) * 0.12 || hi0 * 0.1 || 1;
      const lo = Math.max(0, lo0 - padv), hi = hi0 + padv;
      const X = (i, n) => 6 + (i / Math.max(1, n - 1)) * 568;
      const Y = (v) => 8 + (1 - (v - lo) / (hi - lo || 1)) * 186;
      /* Catmull-Rom → cubic bézier, so the series reads as a smooth curve */
      const line = (arr) => {
        const p = arr.map((v, i) => [X(i, arr.length), Y(v)]);
        if (p.length < 2) return "";
        let dd = "M" + p[0][0].toFixed(1) + " " + p[0][1].toFixed(1);
        for (let i = 0; i < p.length - 1; i++) {
          const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
          const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
          const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
          dd += " C" + c1x.toFixed(1) + " " + c1y.toFixed(1) + " " + c2x.toFixed(1) + " " + c2y.toFixed(1) + " " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
        }
        return dd;
      };
      const grid = [];
      for (let i = 9; i >= 0; i--) {
        const v = lo + (i / 9) * (hi - lo), y = Y(v);
        grid.push({ y: y.toFixed(1), ty: (y + 3).toFixed(1), label: fmt(v) });
      }
      const vlines = cv.map((v, i) => X(i, cv.length).toFixed(1));
      const peakI = cv.indexOf(Math.max(...cv)), lowI = cv.indexOf(Math.min(...cv));
      const mark = (i, tag, color) => {
        const x = X(i, cv.length), y = Y(cv[i]);
        const right = x < 430;
        return {
          i, x: x.toFixed(1), y: y.toFixed(1), color,
          lx: (x / 580 * 100).toFixed(2) + "%", ly: (y / 210 * 100).toFixed(2) + "%",
          shift: right ? "translate(9px, -150%)" : "translate(-100%, -150%) translateX(-9px)",
          label: tag + " · " + fmt(cv[i])
        };
      };
      const lastI = cv.length - 1;
      const marks = [mark(peakI, "Peak", "#ec6d25"), mark(lowI, "Low", "#D94F3A")];
      /* the newest month always carries a label; if it IS the peak or low, say so on that one */
      if (lastI !== peakI && lastI !== lowI) marks.push(mark(lastI, "Latest", "#2FD3B8"));
      else marks.forEach(m => { if (m.i === lastI) m.label += " · latest"; });
      return {
        title, scope: scopeLabel === "All clients" ? "" : scopeLabel,
        curLabel: "Current period (" + this.mon(cur12[0].month, true) + " – " + this.mon(cur12[cur12.length - 1].month, true) + ")",
        lyLabel: ly12.length ? "Prior year (" + this.mon(ly12[0].month, true) + " – " + this.mon(ly12[ly12.length - 1].month, true) + ")" : "Prior year — not in range",
        axisTitle: key === "value" ? "Sales value (R)" : "Sales volume (units)",
        grid, vlines, curPath: line(cv), lyPath: lv.length ? line(lv) : "", marks,
        ticks: cur12.map(r => this.mon(r.month, true)),
        hovers: cur12.map((r, i) => {
          const lyv = lv[i], vs = lyv ? cv[i] / lyv - 1 : null;
          return { label: this.mon(r.month, true), cur: fmt(cv[i]), ly: lyv == null ? "—" : fmt(lyv), vs: this.pct(vs), vsColor: this.tone(vs) };
        }),
        shareTitle: key === "value" ? "Value Share" : "Volume Share",
        shareNote: "Rolling 12-month share of " + (key === "value" ? "value" : "volume") + ", and its move on the prior period",
        shareBlocks: [mkShare("By product bucket", d.bucket_summary, key === "value")]
      };
    };
    const charts = [mkChart("12-Month Sales Value", "value", (v) => this.cur(v)), mkChart("12-Month Sales Volume", "units", (v) => this.num(v))];

    /* bridge */
    const b = d.price_volume_bridge;
    const items = [{ label: "Volume", v: b.volume }, { label: "Mix", v: b.mix }, { label: "Price", v: b.price }, { label: "Net", v: b.net_change }];
    const bmax = Math.max(...items.map(i => Math.abs(i.v)), 1), zero = 108, half = 76;
    const bridgeBars = items.map((it, i) => {
      const h = Math.max(2, (Math.abs(it.v) / bmax) * half), up = it.v >= 0, x = 18 + i * 88;
      return {
        x, w: 62, cx: x + 31, y: (up ? zero - h : zero).toFixed(1), h: h.toFixed(1),
        labelY: (up ? zero - h - 8 : zero + h + 16).toFixed(1), val: this.cur(it.v), label: it.label,
        fill: it.label === "Net" ? (up ? "#22C55E" : "#D94F3A") : up ? "rgba(34,197,94,.75)" : "rgba(217,79,58,.75)"
      };
    });

    /* ---------------- Trend page ---------------- */
    const yearOf = (m) => parseInt(m.slice(0, 4), 10);
    const curYear = yearOf(latest);
    const ytdMonths = series.filter(r => yearOf(r.month) === curYear && !(r.month === latest && partial));
    const ytdKeys = ytdMonths.map(r => r.month.slice(5, 7));
    const lyMonths = series.filter(r => yearOf(r.month) === curYear - 1 && ytdKeys.indexOf(r.month.slice(5, 7)) > -1);
    const sumK = (arr, k) => arr.reduce((a, r) => a + (r[k] || 0), 0);
    const ytdV = sumK(ytdMonths, "value"), ytdU = sumK(ytdMonths, "units");
    const ytdLyV = sumK(lyMonths, "value"), ytdLyU = sumK(lyMonths, "units");
    const ytdVs = ytdLyV ? ytdV / ytdLyV - 1 : null;
    const ytdUVs = ytdLyU ? ytdU / ytdLyU - 1 : null;
    const ppVs = (n, k) => {
      const c = winSum(lastComplete, n, k), p = winSum(lastComplete - n, n, k);
      return p ? c / p - 1 : null;
    };
    const mtd = series[series.length - 1], mtdPrev = series[series.length - 2];
    const tile = (label, value, vs, note) => {
      const up = vs != null && vs > 0;
      return {
        label, value, note, arrow: up ? "▲" : "▼", delta: this.bare(vs, 0),
        color: this.tone(vs),
        pillBg: vs == null ? "rgba(91,155,213,.12)" : up ? "rgba(34,197,94,.12)" : "rgba(217,79,58,.12)"
      };
    };
    const trendKpis = [
      tile("Sales units MTD", this.num(mtd.units), mtdPrev && mtdPrev.units ? mtd.units / mtdPrev.units - 1 : null, "vs last month"),
      tile("Sales value MTD", this.cur(mtd.value), mtdPrev && mtdPrev.value ? mtd.value / mtdPrev.value - 1 : null, "vs last month"),
      tile("Sales units P3M", this.num(winSum(lastComplete, 3, "units")), ppVs(3, "units"), "vs PP"),
      tile("Sales value P3M", this.cur(winSum(lastComplete, 3, "value")), ppVs(3, "value"), "vs PP"),
      tile("Sales units P6M", this.num(winSum(lastComplete, 6, "units")), ppVs(6, "units"), "vs PP"),
      tile("Sales value P6M", this.cur(winSum(lastComplete, 6, "value")), ppVs(6, "value"), "vs PP"),
      tile("Sales units 12M", this.num(winSum(lastComplete, 12, "units")), ppVs(12, "units"), "vs PP"),
      tile("Sales value 12M", this.cur(winSum(lastComplete, 12, "value")), ppVs(12, "value"), "vs PP")
    ];

    const peak = ytdMonths.slice().sort((a, z) => z.value - a.value)[0] || {};
    const traj3 = ppVs(3, "value");
    const trendCards = [
      {
        kicker: "Value vs volume", iconColor: "#22C55E", iconBg: "rgba(34,197,94,.12)", iconBorder: "rgba(34,197,94,.35)",
        icon: "M4 20V10M10 20V4M16 20v-7M22 20H2",
        body: "Value is " + this.pct(ytdVs) + " while volume is " + this.pct(ytdUVs) + " year to date; average price is " + this.pct(ytdU && ytdLyU && ytdLyV ? (ytdV / ytdU) / (ytdLyV / ytdLyU) - 1 : null) + "."
      },
      {
        kicker: "Peak month", iconColor: "#ec6d25", iconBg: "rgba(236,109,37,.12)", iconBorder: "rgba(236,109,37,.4)",
        icon: "M12 3 2 12l10 9 10-9-10-9Z",
        body: peak ? this.mon(peak.month, true) + " delivered the strongest current-year month at " + this.cur(peak.value) + "." : "No complete current-year month yet."
      },
      {
        kicker: "Recent trajectory", iconColor: "#5B9BD5", iconBg: "rgba(91,155,213,.12)", iconBorder: "rgba(91,155,213,.4)",
        icon: "M7 17 17 7M17 7h-6M17 7v6",
        body: "The latest three months are " + this.pct(traj3) + " versus the preceding three months for " + scopeLabel + "."
      }
    ];

    /* year-on-year comparison charts */
    const yoyView = S.yoyView || "monthly";
    const yoyOpts = [{ key: "monthly", label: "Monthly" }, { key: "ytd", label: "YTD running total" }].map(o => ({
      label: o.label, on: yoyView === o.key, pick: () => this.setState({ yoyView: o.key })
    }));
    const MONS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const mkYoY = (title, key, fmt) => {
      const curArr = ytdMonths.map(r => r[key]);
      const lyArr = ytdKeys.map(k => {
        const row = lyMonths.find(r => r.month.slice(5, 7) === k);
        return row ? row[key] : 0;
      });
      const run = (arr) => arr.map((v, i) => arr.slice(0, i + 1).reduce((a, b) => a + b, 0));
      const cv = yoyView === "ytd" ? run(curArr) : curArr;
      const lv = yoyView === "ytd" ? run(lyArr) : lyArr;
      const hiV = Math.max(...cv, ...lv, 1);
      const W = 600, H = 200, n = cv.length || 1;
      const slot = W / n, bw = Math.min(26, slot * 0.32), gapIn = 4;
      const Y = (v) => H - 6 - (v / hiV) * (H - 22);
      const bars = [], labels = [];
      cv.forEach((v, i) => {
        const cx = i * slot + slot / 2;
        const x1 = cx - bw - gapIn / 2, x2 = cx + gapIn / 2;
        [[x1, lv[i], "#7d8fa8"], [x2, v, "#ec6d25"]].forEach(([x, val, fill]) => {
          const y = Y(val);
          bars.push({ x: x.toFixed(1), w: bw.toFixed(1), y: y.toFixed(1), h: Math.max(1, H - 6 - y).toFixed(1), fill });
