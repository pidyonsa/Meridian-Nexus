    const regionCards = [
      {
        kicker: "Largest region", iconColor: "#ec6d25", iconBg: "rgba(236,109,37,.12)", iconBorder: "rgba(236,109,37,.4)",
        icon: "M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z",
        body: regLead ? this.title(regLead.name) + " holds " + (regLead.cv / regSumCur * 100).toFixed(1) + "% of 12-month value at " + this.cur(regLead.cv) + ", " + this.pct(regLead.vVs) + " on the prior year." : "—"
      },
      {
        kicker: "Biggest gain", iconColor: "#22C55E", iconBg: "rgba(34,197,94,.12)", iconBorder: "rgba(34,197,94,.35)",
        icon: "M7 17 17 7M17 7h-6M17 7v6",
        body: regGain ? this.title(regGain.name) + " added " + this.cur(regGain.cv - regGain.lv) + " year on year (" + this.pct(regGain.vVs) + ")." : "—"
      },
      {
        kicker: "Biggest decline", iconColor: "#D94F3A", iconBg: "rgba(217,79,58,.12)", iconBorder: "rgba(217,79,58,.4)",
        icon: "M7 7 17 17M17 17h-6M17 17v-6",
        body: regDrag ? this.title(regDrag.name) + " declined " + this.cur(Math.abs(regDrag.cv - regDrag.lv)) + " (" + this.pct(regDrag.vVs) + ") — the largest regional shortfall." : "—"
      }
    ];

    /* province map — data regions folded onto the nine provinces */
    const PROV = {
      "GAUTENG": "Gauteng", "WESTERN CAPE": "Western Cape", "SWD": "Western Cape",
      "KWAZULU NATAL": "KwaZulu-Natal", "MPUMALANGA": "Mpumalanga", "LIMPOPO": "Limpopo",
      "FREE STATE": "Free State", "NORTH WEST": "North West", "NORTHERN CAPE": "Northern Cape",
      "EASTERN CAPE": "Eastern Cape", "EAST LONDON": "Eastern Cape", "PORT ELIZABETH": "Eastern Cape"
    };
    const provAgg = {};
    regAgg.forEach(r => {
      const p = PROV[r.name];
      if (!p) return;
      const t = provAgg[p] || (provAgg[p] = { cv: 0, lv: 0, cu: 0, lu: 0, keys: [] });
      t.cv += r.cv; t.lv += r.lv; t.cu += r.cu; t.lu += r.lu; t.keys.push(r.name);
    });
    const provSumCur = Object.keys(provAgg).reduce((a, k) => a + provAgg[k].cv, 0) || 1;
    const provSumUnits = Object.keys(provAgg).reduce((a, k) => a + provAgg[k].cu, 0) || 1;
    const mapMeasure = S.mapMeasure || "value";
    const byVol = mapMeasure === "volume";
    const mapRows = {};
    Object.keys(provAgg).forEach(k => {
      const t = provAgg[k];
      const vVs = t.lv ? t.cv / t.lv - 1 : null, uVs = t.lu ? t.cu / t.lu - 1 : null;
      const vs = byVol ? uVs : vVs;
      mapRows[k] = {
        value: this.cur(t.cv), units: this.num(t.cu), vs: vs, vsLabel: this.pct(vs),
        size: byVol ? t.cu : t.cv,
        share: ((byVol ? t.cu / provSumUnits : t.cv / provSumCur) * 100).toFixed(1) + "%", keys: t.keys
      };
    });
    this._mapPayload = { rows: mapRows, selected: PROV[S.region] || null, measure: mapMeasure };
    Promise.resolve().then(() => this.postMap());
    const mapBands = [
      { label: "Above +5%", fill: "#2FA97C" }, { label: "0% to +5%", fill: "#5B9BD5" },
      { label: "-5% to 0%", fill: "#3d5f86" }, { label: "-15% to -5%", fill: "#E8A838" },
      { label: "Below -15%", fill: "#D94F3A" }
    ];
    const provList = Object.keys(provAgg).map(k => Object.assign({ name: k }, provAgg[k]));
    const shareBar = (key, total, fmtPct) => {
      const sorted = provList.slice().sort((a, z) => z[key] - a[key]);
      const hi = sorted[0] ? sorted[0][key] : 1;
      const top3 = sorted.slice(0, 3).reduce((a, r) => a + r[key], 0);
      return {
        rows: sorted.map(r => ({
          name: r.name, pct: (r[key] / total * 100).toFixed(1) + "%", w: (r[key] / hi * 100).toFixed(1) + "%"
        })),
        note: "Top 3: " + (top3 / total * 100).toFixed(1) + "% · leader: " + (sorted[0] ? sorted[0].name : "—")
      };
    };
    const valueShare = shareBar("cv", provSumCur);
    const volumeShare = shareBar("cu", provSumUnits);

    // Divisional snapshot (Central/Coastal/Inland) -- same confirmed-complete
    // Region->Division mapping used server-side for the ?zone= filter fix,
    // 2026-08-22 (Carin: put the value/volume split by division below the
    // Regional snapshot, each as a %). Computed client-side from the
    // already-loaded province data rather than a new API call.
    const SI_REGION_DIVISION = {
      'EAST LONDON/EASTERN CAPE': 'Coastal', 'FREE STATE': 'Central', 'GAUTENG': 'Inland',
      'KWA-ZULU NATAL': 'Coastal', 'LIMPOPO': 'Inland', 'MPUMALANGA': 'Inland',
      'NORTH WEST': 'Central', 'PE OPERATIONS': 'Coastal', 'SWD OPERATIONS': 'Coastal',
      'WESTERN CAPE': 'Coastal',
    };
    const divAgg = {};
    provList.forEach(r => {
      const div = SI_REGION_DIVISION[(r.name || "").trim().toUpperCase()] || "Unmapped";
      const t = divAgg[div] || (divAgg[div] = { name: div, cv: 0, cu: 0 });
      t.cv += r.cv; t.cu += r.cu;
    });
    const divList = Object.values(divAgg);
    const divColors = { Central: "#5B9BD5", Coastal: "#2FA97C", Inland: "#ec6d25", Unmapped: "#8DA2B5" };
    const divisionSnapshot = ["Central", "Coastal", "Inland"].map(name => {
      const t = divAgg[name] || { cv: 0, cu: 0 };
      return {
        name, color: divColors[name],
        valuePct: (provSumCur ? t.cv / provSumCur * 100 : 0).toFixed(1) + "%",
        volumePct: (provSumUnits ? t.cu / provSumUnits * 100 : 0).toFixed(1) + "%",
        value: this.cur(t.cv), units: this.num(t.cu),
      };
    });
    const provByVal = provList.slice().sort((a, z) => z.cv - a.cv)[0] || {};
    const provByVol = provList.slice().sort((a, z) => z.cu - a.cu)[0] || {};
    const provGrowth = provList.slice().filter(r => r.lv).sort((a, z) => (z.cv / z.lv) - (a.cv / a.lv))[0] || {};
    const provRisk = provList.slice().filter(r => r.lv).sort((a, z) => (a.cv / a.lv) - (z.cv / z.lv))[0] || {};
    const snapTile = (kicker, name, note, color) => ({ kicker, name, note, color });
    const regionSnapshot = [
      snapTile("Value leader", provByVal ? provByVal.name : "—", provByVal ? this.cur(provByVal.cv) + " · " + this.pct(provByVal.lv ? provByVal.cv / provByVal.lv - 1 : null) + " YoY" : "", "#ec6d25"),
      snapTile("Volume leader", provByVol ? provByVol.name : "—", provByVol ? this.num(provByVol.cu) + " units · " + this.pct(provByVol.lu ? provByVol.cu / provByVol.lu - 1 : null) + " YoY" : "", "#5B9BD5"),
      snapTile("Strongest growth", provGrowth ? provGrowth.name : "—", provGrowth ? "Value " + this.pct(provGrowth.cv / provGrowth.lv - 1) + " · Volume " + this.pct(provGrowth.lu ? provGrowth.cu / provGrowth.lu - 1 : null) : "", "#22C55E"),
      snapTile("Largest risk", provRisk ? provRisk.name : "—", provRisk ? "Value " + this.pct(provRisk.cv / provRisk.lv - 1) + " · Volume " + this.pct(provRisk.lu ? provRisk.cu / provRisk.lu - 1 : null) : "", "#D94F3A")
    ];

    /* monthly lines for the top regions */
    const LINE_COLORS = ["#ec6d25", "#5B9BD5", "#22C55E", "#E8A838", "#9dc4ec", "#D94F3A"];
    const regTop = regAgg.slice(0, 6);
    const rKey = isVal ? "value" : "units";
    const rFmt = isVal ? (v) => this.cur(v) : (v) => this.num(v);
    const rHi = Math.max(...regTop.map(r => Math.max(...r.monthly.map(m => m[rKey]))), 1);
    const RW = 620, RH = 210;
    const rY = (v) => RH - 8 - (v / rHi) * (RH - 24);
    const rX = (i) => win12.length < 2 ? 0 : (i / (win12.length - 1)) * RW;
    const regionLines = regTop.map((r, i) => ({
      name: this.title(r.name), color: LINE_COLORS[i % LINE_COLORS.length],
      path: r.monthly.map((m, j) => (j ? "L" : "M") + rX(j).toFixed(1) + " " + rY(m[rKey]).toFixed(1)).join(" "),
      last: rFmt(r.monthly[r.monthly.length - 1][rKey])
    }));
    const regionGrid = [];
    for (let i = 5; i >= 0; i--) { const v = (i / 5) * rHi; regionGrid.push({ y: rY(v).toFixed(1), label: rFmt(v) }); }
    const regionTicks = win12.map(m => this.mon(m, true));
    const regionLineTitle = "Monthly " + (isVal ? "value" : "volume") + " by region — top " + regTop.length;
    const regionHovers = win12.map((m, j) => ({
      label: this.mon(m, true),
      pts: regTop.map((r, i) => ({ name: this.title(r.name), color: LINE_COLORS[i % LINE_COLORS.length], val: rFmt(r.monthly[j][rKey]) }))
    }));

    /* ---------------- Brands page ---------------- */
    /* brands now come from brand_monthly, so the reporting period applies */
    const bN = rollN || 12;
    const bEndI = monthsAll.indexOf(series[lastComplete].month);
    const bCurMonths = monthsAll.slice(Math.max(0, bEndI - bN + 1), bEndI + 1);
    const bLyMonths = monthsAll.slice(Math.max(0, bEndI - bN * 2 + 1), Math.max(0, bEndI - bN + 1));
    const bmMonthly = {};
    const bmAgg = {};
    (d.brand_monthly || []).forEach(r => {
      const k = r.brand;
      if (!k || String(k).toLowerCase() === "nan" || String(k).toLowerCase() === "(blank)") return;
      const t = bmAgg[k] || (bmAgg[k] = { dim: k, cur_value: 0, ly_value: 0, cur_units: 0, ly_units: 0 });
      (bmMonthly[k] || (bmMonthly[k] = {}))[r.month] = r;
      if (bCurMonths.indexOf(r.month) > -1) { t.cur_value += r.sales_value; t.cur_units += r.sales_units; }
      else if (bLyMonths.indexOf(r.month) > -1) { t.ly_value += r.sales_value; t.ly_units += r.sales_units; }
    });
    const bFromMonthly = Object.keys(bmAgg).map(k => {
      const t = bmAgg[k];
      t.delta_value = t.cur_value - t.ly_value;
      t.delta_units = t.cur_units - t.ly_units;
      t.value_vs_pct = t.ly_value ? t.cur_value / t.ly_value - 1 : null;
      t.units_vs_pct = t.ly_units ? t.cur_units / t.ly_units - 1 : null;
      return t;
    }).filter(t => t.cur_value > 0 || t.ly_value > 0);
    const bRowsAll = bFromMonthly.length
      ? bFromMonthly
      : d.dimension_brand.rows.filter(r => r.dim && String(r.dim).toLowerCase() !== "nan");
    const bPeriodLabel = bN + " months to " + this.mon(series[lastComplete].month, true);
    const bCmpWord = bN === 12 ? "prior year" : "prior " + bN + " months";
    const bCmpShort = bN === 12 ? "vs LY" : "vs PP";
    const bTotCur = bRowsAll.reduce((a, r) => a + r.cur_value, 0) || 1;
    const bTotLy = bRowsAll.reduce((a, r) => a + r.ly_value, 0) || 1;
    const bTotUnits = bRowsAll.reduce((a, r) => a + r.cur_units, 0) || 1;
    const bq = (S.bq || "").trim().toLowerCase();
    const bSort = S.bSort || "val";
    const bSorters = {
      val: (a, z) => z.cur_value - a.cur_value,
      vol: (a, z) => z.cur_units - a.cur_units,
      gain: (a, z) => z.delta_value - a.delta_value,
      drop: (a, z) => a.delta_value - z.delta_value,
      growth: (a, z) => (z.value_vs_pct == null ? -9 : z.value_vs_pct) - (a.value_vs_pct == null ? -9 : a.value_vs_pct)
    };
    /* the global Brand filter narrows this table too; the search box narrows it further */
    let bFiltered = bRowsAll.filter(r =>
      (S.brand === "all" || r.dim === S.brand) &&
      (!bq || String(r.dim).toLowerCase().indexOf(bq) > -1));
    bFiltered = bFiltered.slice().sort(bSorters[bSort] || bSorters.val);
    const bLimit = S.bLimit || 15;
    const bMax = Math.max(...bFiltered.slice(0, bLimit).map(r => Math.max(r.cur_value, r.ly_value)), 1);
    const brandTableRows = bFiltered.slice(0, bLimit).map((r, i) => {
      const pc = r.cur_units ? r.cur_value / r.cur_units : null;
      const pl = r.ly_units ? r.ly_value / r.ly_units : null;
      const pVs = pc && pl ? pc / pl - 1 : null;
      const sharePp = r.cur_value / bTotCur - r.ly_value / bTotLy;
      const on = S.brand !== "all" && r.dim === S.brand;
      return {
        rank: i + 1, name: this.title(r.dim),
        value: this.cur(r.cur_value), vVs: this.pct(r.value_vs_pct), vVsColor: this.tone(r.value_vs_pct),
        units: this.num(r.cur_units), uVs: this.pct(r.units_vs_pct), uVsColor: this.tone(r.units_vs_pct),
        price: pc ? "R" + pc.toFixed(2) : "—", pVs: this.pct(pVs), pVsColor: this.tone(pVs),
        delta: this.cur(r.delta_value), deltaColor: this.tone(r.delta_value),
        share: (r.cur_value / bTotCur * 100).toFixed(2) + "%",
        sharePp: (sharePp >= 0 ? "+" : "") + (sharePp * 100).toFixed(2) + "pp", sharePpColor: this.tone(sharePp),
        barCur: (r.cur_value / bMax * 100).toFixed(1) + "%", barLy: (r.ly_value / bMax * 100).toFixed(1) + "%",
        rowBg: on ? "rgba(236,109,37,.10)" : "transparent",
        pick: () => this.setState({ brand: r.dim === S.brand ? "all" : r.dim })
      };
    });
    const brandCols = [
      { label: "#", align: "left", color: "#4A6B8A" }, { label: "Brand", align: "left", color: "#4A6B8A" },
      { label: bN + "m value", align: "right", color: "#ec6d25" }, { label: bCmpShort, align: "right", color: "#ec6d25" },
      { label: bN + "m volume", align: "right", color: "#5B9BD5" }, { label: bCmpShort, align: "right", color: "#5B9BD5" },
      { label: "Avg price", align: "right", color: "#8DA2B5" }, { label: bCmpShort, align: "right", color: "#8DA2B5" },
      { label: "Rand change", align: "right", color: "#8DA2B5" }, { label: "Share", align: "right", color: "#8DA2B5" },
      { label: "Share shift", align: "right", color: "#8DA2B5" }, { label: "This period vs last", align: "left", color: "#4A6B8A" }
    ];
    const brandSortOpts = [
      { key: "val", label: "Largest value" }, { key: "vol", label: "Largest volume" },
      { key: "gain", label: "Biggest gain" }, { key: "drop", label: "Biggest drop" }, { key: "growth", label: "Fastest growth" }
    ].map(o => ({ key: o.key, label: o.label }));

    /* contribution — who moved the number */
    const bByDelta = bRowsAll.slice().sort((a, z) => z.delta_value - a.delta_value);
    const bUp = bByDelta.slice(0, 8);
    const bDown = bByDelta.slice(-8).reverse();
    const contribMax = Math.max(...bUp.concat(bDown).map(r => Math.abs(r.delta_value)), 1);
    const contribRow = (r) => ({
      name: this.title(r.dim), delta: this.cur(r.delta_value),
      w: (Math.abs(r.delta_value) / contribMax * 100).toFixed(1) + "%",
      fill: r.delta_value >= 0 ? "#22C55E" : "#D94F3A",
      color: this.tone(r.delta_value), vs: this.pct(r.value_vs_pct),
      pick: () => this.setState({ brand: r.dim === S.brand ? "all" : r.dim })
    });
    const brandGainers = bUp.map(contribRow);
    const brandLosers = bDown.map(contribRow);
    const upSum = bRowsAll.filter(r => r.delta_value > 0).reduce((a, r) => a + r.delta_value, 0);
    const downSum = bRowsAll.filter(r => r.delta_value < 0).reduce((a, r) => a + r.delta_value, 0);

    /* the same read, on units */
    const bByUnits = bRowsAll.slice().sort((a, z) => z.delta_units - a.delta_units);
    const uUp = bByUnits.slice(0, 8), uDown = bByUnits.slice(-8).reverse();
    const uMax = Math.max(...uUp.concat(uDown).map(r => Math.abs(r.delta_units)), 1);
    const unitRow = (r) => ({
      name: this.title(r.dim), delta: (r.delta_units >= 0 ? "+" : "−") + this.num(Math.abs(r.delta_units)),
      w: (Math.abs(r.delta_units) / uMax * 100).toFixed(1) + "%",
      fill: r.delta_units >= 0 ? "#5B9BD5" : "#D94F3A", color: this.tone(r.delta_units),
      pick: () => this.setState({ brand: r.dim === S.brand ? "all" : r.dim })
    });
    const volGainers = uUp.map(unitRow), volLosers = uDown.map(unitRow);
    const uUpSum = bRowsAll.filter(r => r.delta_units > 0).reduce((a, r) => a + r.delta_units, 0);
    const uDownSum = bRowsAll.filter(r => r.delta_units < 0).reduce((a, r) => a + r.delta_units, 0);

    /* growth matrix — value growth against volume growth for the biggest brands */
    const mTop = bRowsAll.slice().sort((a, z) => z.cur_value - a.cur_value).slice(0, 30)
      .filter(r => r.value_vs_pct != null && r.units_vs_pct != null);
    /* the plot is inset so a clamped bubble still sits fully inside the frame */
    const MW = 560, MH = 300, PADX = 30, PADY = 26, DOM = 0.5;
    const cap = (v) => Math.max(-DOM, Math.min(DOM, v));
    const mx = (v) => PADX + ((cap(v) + DOM) / (DOM * 2)) * (MW - PADX * 2);
    const my = (v) => (MH - PADY) - ((cap(v) + DOM) / (DOM * 2)) * (MH - PADY * 2);
    const rMax = Math.max(...mTop.map(r => r.cur_value), 1);
    const brandDots = mTop.map(r => {
      const off = Math.abs(r.value_vs_pct) > DOM || Math.abs(r.units_vs_pct) > DOM;
      return {
        name: this.title(r.dim),
        big: r.cur_value / rMax > 0.18,
        cx: mx(r.units_vs_pct).toFixed(1), cy: my(r.value_vs_pct).toFixed(1),
        r: (5 + Math.sqrt(r.cur_value / rMax) * 14).toFixed(1),
        ringR: (5 + Math.sqrt(r.cur_value / rMax) * 14 + 3.5).toFixed(1),
        ringOpacity: off ? 0.9 : 0,
        fill: r.value_vs_pct >= 0 && r.units_vs_pct >= 0 ? "rgba(34,197,94,.55)"
          : r.value_vs_pct >= 0 ? "rgba(236,109,37,.55)"
          : r.units_vs_pct >= 0 ? "rgba(91,155,213,.55)" : "rgba(217,79,58,.5)",
        stroke: r.dim === S.brand ? "#f3f7fc" : "rgba(6,20,38,.5)",
        tip: this.title(r.dim) + " · " + this.cur(r.cur_value) + " · value " + this.pct(r.value_vs_pct)
          + " · volume " + this.pct(r.units_vs_pct) + (off ? " (beyond ±50% — pinned to the edge)" : ""),
        pick: () => this.setState({ brand: r.dim === S.brand ? "all" : r.dim })
      };
    });
    /* clamped brands would stack on one pixel — fan them along the edge they hit */
    const seen = {};
    brandDots.forEach(p => {
      if (!p.ringOpacity) return;
      const k = p.cx + "|" + p.cy;
      const n = seen[k] = (seen[k] || 0) + 1;
      if (n === 1) return;
      const step = (n - 1) * (parseFloat(p.r) * 2 + 4);
      const atTop = parseFloat(p.cy) <= PADY + 1, atBottom = parseFloat(p.cy) >= MH - PADY - 1;
      if (atTop || atBottom) {
        p.cx = (parseFloat(p.cx) - step * (parseFloat(p.cx) > MW / 2 ? 1 : -1)).toFixed(1);
      } else {
        p.cy = (parseFloat(p.cy) + step * (parseFloat(p.cy) > MH / 2 ? -1 : 1)).toFixed(1);
      }
    });
    const offCount = brandDots.filter(p => p.ringOpacity > 0).length;
    const matrixQuads = [
      { label: "Growing on both", x: "60%", y: "3%", color: "#22C55E" },
      { label: "Price-led growth", x: "7%", y: "3%", color: "#ec6d25" },
      { label: "Volume-led, value down", x: "60%", y: "93%", color: "#5B9BD5" },
      { label: "Declining on both", x: "7%", y: "93%", color: "#D94F3A" }
    ];
    const axisVals = [-0.5, -0.25, 0, 0.25, 0.5];
    const matrixTicks = axisVals.map(v => ({
      label: (v > 0 ? "+" : "") + (v * 100).toFixed(0) + "%",
      x: mx(v).toFixed(1), gx: mx(v).toFixed(1),
      edge: Math.abs(v) === DOM
    }));
    const matrixYTicks = axisVals.slice().reverse().map(v => ({
      label: (v > 0 ? "+" : "") + (v * 100).toFixed(0) + "%", y: my(v).toFixed(1)
    }));
    const matrixNote = "Top 30 brands — volume growth across, value growth up. Bubble size is 12-month value; click one to filter."
      + (offCount ? " " + offCount + " brand" + (offCount === 1 ? "" : "s") + " move beyond ±50% and sit ringed on the edge." : "");

    /* selected-brand focus */
    const bSel = S.brand === "all" ? null : bRowsAll.find(r => r.dim === S.brand);
    const brandFocus = bSel ? {
      name: this.title(bSel.dim),
      value: this.cur(bSel.cur_value), vVs: this.pct(bSel.value_vs_pct), vVsColor: this.tone(bSel.value_vs_pct),
      units: this.num(bSel.cur_units), uVs: this.pct(bSel.units_vs_pct), uVsColor: this.tone(bSel.units_vs_pct),
      price: bSel.cur_units ? "R" + (bSel.cur_value / bSel.cur_units).toFixed(2) : "—",
      delta: this.cur(bSel.delta_value), deltaColor: this.tone(bSel.delta_value),
      share: (bSel.cur_value / bTotCur * 100).toFixed(2) + "%",
      rank: "#" + (bRowsAll.slice().sort((a, z) => z.cur_value - a.cur_value).findIndex(r => r.dim === bSel.dim) + 1) + " of " + bRowsAll.length
    } : null;

    /* store-level share standouts */
    const brandSignals = d.insights_brands.slice()
      .sort((a, z) => z.Brand_Share_vs_Peer - a.Brand_Share_vs_Peer).slice(0, 8).map(r => ({
        brand: this.title(r["cleaned brand"]), store: this.title(r["cleaned store name"]),
        share: (r.Brand_Share * 100).toFixed(1) + "%", peer: (r.Peer_Avg_Brand_Share * 100).toFixed(1) + "%",
        gap: "+" + (r.Brand_Share_vs_Peer * 100).toFixed(1) + "pp",
        change: this.cur(r.Brand_Value_Change), changeColor: this.tone(r.Brand_Value_Change)
      }));

    /* headline tiles */
    const bPrice = bTotUnits ? bTotCur / bTotUnits : null;
    const bTotUnitsLy = bRowsAll.reduce((a, r) => a + r.ly_units, 0) || 1;
    const bPriceLy = bTotUnitsLy ? bTotLy / bTotUnitsLy : null;
    const activeNow = bRowsAll.filter(r => r.cur_value > 0).length;
    const activeLy = bRowsAll.filter(r => r.ly_value > 0).length;
    const bTile = (label, value, vs, note, absDelta) => {
      const up = vs != null && vs > 0;
      return {
        label, value, note,
        delta: absDelta != null ? Math.abs(absDelta) : this.bare(vs, 1),

    const brandKpis = [
      bTile("Total brand value", this.cur(bTotCur), bTotLy ? bTotCur / bTotLy - 1 : null, "vs prior " + bN + "m"),
      bTile("Units sold", this.num(bTotUnits), bTotUnitsLy ? bTotUnits / bTotUnitsLy - 1 : null, "vs prior " + bN + "m"),
      bTile("Active brands", this.int(activeNow), activeLy ? activeNow / activeLy - 1 : null, "vs prior " + bN + "m", activeNow - activeLy),
      bTile("Average price", bPrice ? "R" + bPrice.toFixed(2) : "—", bPrice && bPriceLy ? bPrice / bPriceLy - 1 : null, "vs prior " + bN + "m")
    ];

    /* share and concentration */
    const concMeasure = S.concMeasure || "value";
    const cKey = concMeasure === "volume" ? "cur_units" : "cur_value";
    const cTot = concMeasure === "volume" ? bTotUnits : bTotCur;
    const donutTop = bRowsAll.slice().sort((a, z) => z[cKey] - a[cKey]).slice(0, 8);
    const donutOther = cTot - donutTop.reduce((a, r) => a + r[cKey], 0);
    const DONUT = ["#ec6d25", "#f2955c", "#5B9BD5", "#22C55E", "#9dc4ec", "#E8A838", "#7d8fa8", "#3B82F6"];
    const C = 2 * Math.PI * 54;
    let acc = 0;
    const donutSegs = donutTop.map((r, i) => {
      const frac = r[cKey] / cTot;

        name: this.title(r.dim), fill: DONUT[i % DONUT.length],

        offset: (-acc * C).toFixed(2),
        share: (frac * 100).toFixed(1) + "%"
      };
      acc += frac;
      return seg;
    }).concat([{
      name: "All other brands", fill: "#2a4straight".replace("straight", "365"),
      dash: (Math.max(0, donutOther) / cTot * C).toFixed(2) + " " + (C - Math.max(0, donutOther) / cTot * C).toFixed(2),
      offset: (-acc * C).toFixed(2), share: (Math.max(0, donutOther) / cTot * 100).toFixed(1) + "%"
    }]);
    const top5Share = donutTop.slice(0, 5).reduce((a, r) => a + r[cKey], 0) / cTot;
    const top8Share = acc;
    const concLevel = top5Share > 0.6 ? "High" : top5Share > 0.35 ? "Medium" : "Low";
    const concColor = top5Share > 0.6 ? "#D94F3A" : top5Share > 0.35 ? "#E8A838" : "#22C55E";
    const concentration2 = {
      top8: (top8Share * 100).toFixed(1) + "%",
      level: concLevel, color: concColor,
      needle: (top5Share / 1 * 100).toFixed(1) + "%",
      note: "Top 5 brands carry " + (top5Share * 100).toFixed(1) + "% of brand " + concMeasure + "; the tail of "
        + this.int(bRowsAll.length - 8) + " brands carries " + (Math.max(0, donutOther) / cTot * 100).toFixed(1) + "%.",
      subline: "How much of brand " + concMeasure + " sits with the largest brands",
      opts: [{ key: "value", label: "Value" }, { key: "volume", label: "Volume" }].map(o => ({
        label: o.label, on: concMeasure === o.key, pick: () => this.setState({ concMeasure: o.key })
      }))
    };

    /* monthly lines by brand */
    const bLineMeasure = S.bLineMeasure || (isVal ? "value" : "volume");
    const bLineVal = bLineMeasure === "value";
    const bmKey = bLineVal ? "sales_value" : "sales_units";
    const bmFmt = bLineVal ? (v) => this.cur(v) : (v) => this.num(v);
    const bLineOpts = [{ key: "value", label: "Value" }, { key: "volume", label: "Volume" }].map(o => ({
      label: o.label, on: bLineMeasure === o.key, pick: () => this.setState({ bLineMeasure: o.key })
    }));
    const bTopNames = (S.brand !== "all" ? [S.brand]
      : bRowsAll.slice().sort((a, z) => z.cur_value - a.cur_value).slice(0, 6).map(r => r.dim));
    const BR_COLORS = ["#ec6d25", "#5B9BD5", "#22C55E", "#E8A838", "#9dc4ec", "#7d8fa8"];
    const bmSeries = bTopNames.map((name, i) => ({
      name: this.title(name), color: BR_COLORS[i % BR_COLORS.length],
      pts: bCurMonths.map(m => { const row = (bmMonthly[name] || {})[m]; return row ? row[bmKey] : 0; })
    }));
    const bmHi = Math.max(...bmSeries.reduce((a, s) => a.concat(s.pts), [0]), 1);
    const BW = 620, BH = 210;
    const bmY = (v) => BH - 8 - (v / bmHi) * (BH - 24);
    const bmX = (i) => bCurMonths.length < 2 ? 0 : (i / (bCurMonths.length - 1)) * BW;
    const brandLines = bmSeries.map(s => ({
      name: s.name, color: s.color,
      path: s.pts.map((v, j) => (j ? "L" : "M") + bmX(j).toFixed(1) + " " + bmY(v).toFixed(1)).join(" ")
    }));
    const brandLineGrid = [];
    for (let i = 5; i >= 0; i--) { const v = (i / 5) * bmHi; brandLineGrid.push({ y: bmY(v).toFixed(1), label: bmFmt(v) }); }
    const brandLineTicks = bCurMonths.map(m => this.mon(m, true));
    const brandLineHovers = bCurMonths.map((m, j) => ({
      label: this.mon(m, true),
      pts: bmSeries.map(s => ({ name: s.name, color: s.color, val: bmFmt(s.pts[j]) }))
    }));
    const brandLineTitle = "Monthly " + (bLineVal ? "value" : "volume") + " by brand"
      + (S.brand !== "all" ? " — " + this.title(S.brand) : " — top " + bmSeries.length);

    const bLeader = bRowsAll.slice().sort((a, z) => z.cur_value - a.cur_value)[0] || {};
    const brandCards = [
      {
        kicker: "Brand leader", iconColor: "#ec6d25", iconBg: "rgba(236,109,37,.12)", iconBorder: "rgba(236,109,37,.4)",
        icon: "m20.6 13.4-7.2 7.2a2 2 0 0 1-2.8 0l-8.2-8.2V3h9.4l8.8 8.8a2 2 0 0 1 0 1.6Z",
        body: bLeader ? this.title(bLeader.dim) + " leads at " + this.cur(bLeader.cur_value) + " — " + (bLeader.cur_value / bTotCur * 100).toFixed(1) + "% of brand value, " + this.pct(bLeader.value_vs_pct) + " on last year." : "—"
      },
      {
        kicker: "Biggest gain", iconColor: "#22C55E", iconBg: "rgba(34,197,94,.12)", iconBorder: "rgba(34,197,94,.35)",
        icon: "M7 17 17 7M17 7h-6M17 7v6",
        body: bUp[0] ? this.title(bUp[0].dim) + " added " + this.cur(bUp[0].delta_value) + " (" + this.pct(bUp[0].value_vs_pct) + ") — the largest single brand contribution." : "—"
      },
      {
        kicker: "Biggest decline", iconColor: "#D94F3A", iconBg: "rgba(217,79,58,.12)", iconBorder: "rgba(217,79,58,.4)",
        icon: "M7 7 17 17M17 17h-6M17 17v-6",
        body: bDown[0] ? this.title(bDown[0].dim) + " declined " + this.cur(Math.abs(bDown[0].delta_value)) + " (" + this.pct(bDown[0].value_vs_pct) + ")." : "—"
      }
    ];

    /* ---------------- Channels page ---------------- */
    const chWin = S.chWin || "12m";
    const is3 = chWin === "3m";
    const chSuffix = is3 ? "_3m" : "_12m";
    const chBuckets = d.banner_bucket_summary.slice().sort((a, z) => z["val" + chSuffix] - a["val" + chSuffix]);
    const chValTot = chBuckets.reduce((a, r) => a + r["val" + chSuffix], 0) || 1;
    const chVolTot = chBuckets.reduce((a, r) => a + r["vol" + chSuffix], 0) || 1;
    const CH_COLORS = ["#ec6d25", "#5B9BD5", "#22C55E", "#E8A838", "#9dc4ec", "#7d8fa8"];
    const bucketRows = chBuckets.map((r, i) => {
      const vShare = r["val" + chSuffix] / chValTot, uShare = r["vol" + chSuffix] / chVolTot;
      const vVs = r["val" + chSuffix + "_vs_pp"], uVs = r["vol" + chSuffix + "_vs_pp"];
      const pp = is3 ? null : r.val_12m_share_pp_change;
      return {
        name: r.bucket, fill: CH_COLORS[i % CH_COLORS.length],
        value: this.cur(r["val" + chSuffix]), units: this.num(r["vol" + chSuffix]),
        vShare: (vShare * 100).toFixed(1) + "%", uShare: (uShare * 100).toFixed(1) + "%",
        vBar: (vShare * 100).toFixed(1) + "%", uBar: (uShare * 100).toFixed(1) + "%",
        vVs: this.pct(vVs), vVsColor: this.tone(vVs), uVs: this.pct(uVs), uVsColor: this.tone(uVs),
        pp: pp == null ? "—" : (pp >= 0 ? "+" : "") + (pp * 100).toFixed(2) + "pp",
        ppColor: pp == null ? "#8DA2B5" : this.tone(pp)
      };
    });
    const chWinOpts = [{ key: "12m", label: "Rolling 12m" }, { key: "3m", label: "Latest 3m" }].map(o => ({
      label: o.label, on: chWin === o.key, pick: () => this.setState({ chWin: o.key })
    }));

    /* retailers */
    /* retailers now come from banner_monthly, so the reporting period applies */
    const rN = rollN || 12;
    const rEndI = monthsAll.indexOf(series[lastComplete].month);
    const rCurMonths = monthsAll.slice(Math.max(0, rEndI - rN + 1), rEndI + 1);
    const rLyMonths = monthsAll.slice(Math.max(0, rEndI - rN * 2 + 1), Math.max(0, rEndI - rN + 1));
    const bnMonthly = {};
    const bnAgg = {};
    (d.banner_monthly || []).forEach(r => {
      const k = r.banner;
      if (!k || String(k).toLowerCase() === "nan") return;
      const t = bnAgg[k] || (bnAgg[k] = { dim: k, cur_value: 0, ly_value: 0, cur_units: 0, ly_units: 0, store_count: 0 });
      (bnMonthly[String(k).toUpperCase()] || (bnMonthly[String(k).toUpperCase()] = {}))[r.month] = r;
      if (rCurMonths.indexOf(r.month) > -1) {
        t.cur_value += r.sales_value; t.cur_units += r.sales_units;
        // "Trading stores" for this banner = the latest month in the
        // current window's distinct store count, not a sum across months
        // (added 2026-08-22: this replaced a lookup into d.store_performance,
        // which is empty until the Stores page has been visited -- the
        // "Number of stores" column was blank for every row until then,
        // same bug class as the regionOpts/brandOpts "stuck empty" fix).
        if (r.month === rCurMonths[rCurMonths.length - 1]) t.store_count = r.store_count || 0;
      }
      else if (rLyMonths.indexOf(r.month) > -1) { t.ly_value += r.sales_value; t.ly_units += r.sales_units; }
    });
    const rFromMonthly = Object.keys(bnAgg).map(k => {
      const t = bnAgg[k];
      t.delta_value = t.cur_value - t.ly_value;
      t.delta_units = t.cur_units - t.ly_units;
      t.value_vs_pct = t.ly_value ? t.cur_value / t.ly_value - 1 : null;
      t.units_vs_pct = t.ly_units ? t.cur_units / t.ly_units - 1 : null;
      return t;
    }).filter(t => t.cur_value > 0 || t.ly_value > 0);
    const rRowsAll = rFromMonthly.length
      ? rFromMonthly
      : d.dimension_banner.rows.filter(r => r.dim && String(r.dim).toLowerCase() !== "nan");
    const chPeriodLabel = rN + " months to " + this.mon(series[lastComplete].month, true);
    const chCmpWord = rN === 12 ? "prior year" : "prior " + rN + " months";
    const chCmpShort = rN === 12 ? "vs LY" : "vs PP";
    const rTotCur = rRowsAll.reduce((a, r) => a + r.cur_value, 0) || 1;
    const rTotLy = rRowsAll.reduce((a, r) => a + r.ly_value, 0) || 1;
    const rTotUnits = rRowsAll.reduce((a, r) => a + r.cur_units, 0) || 1;
    const rTotUnitsLy = rRowsAll.reduce((a, r) => a + r.ly_units, 0) || 1;
    const storesPerBanner = {};
    d.store_performance.forEach(s => {
      const k = String(s.banner || "").toUpperCase();
      storesPerBanner[k] = (storesPerBanner[k] || 0) + 1;
    });
    // Same banner->channel-type classification as BANNER_BUCKET_MAP in
    // sales_queries.py (also used server-side for the "Channel types" table
    // above) -- kept in sync by hand, no shared source of truth between the
    // two, same caveat as the backend's own comment on that map. Added
    // 2026-08-22 so the retailer league table can filter to one segment.
    const BANNER_BUCKET = {
      "BABY CITY": "Grocery / Supermarkets", "BOXER": "Grocery / Supermarkets", "CHECKERS": "Grocery / Supermarkets",
      "CHECKERS HYPER": "Grocery / Supermarkets", "CHECKERS LITTLE ME": "Grocery / Supermarkets",
      "CHECKERS OUTDOOR": "Grocery / Supermarkets", "FOODWORLD": "Grocery / Supermarkets", "GAME": "Grocery / Supermarkets",
      "JWAYELANI": "Grocery / Supermarkets", "KWIKSPAR": "Grocery / Supermarkets", "OK FOODS": "Grocery / Supermarkets",
      "OK GROCER": "Grocery / Supermarkets", "OK MINIMARK": "Grocery / Supermarkets",

      "PICK N PAY LOCAL": "Grocery / Supermarkets", "PICK N PAY MINI MARKET": "Grocery / Supermarkets",
      "SAVEMOR": "Grocery / Supermarkets", "SHOPRITE": "Grocery / Supermarkets", "SHOPRITE MINI": "Grocery / Supermarkets",
      "SPAR": "Grocery / Supermarkets", "SPAR EXPRESS": "Grocery / Supermarkets", "SUPERSPAR": "Grocery / Supermarkets",
      "USAVE": "Grocery / Supermarkets", "CHECKERS DARK STORE": "Grocery / Supermarkets", "MAKRO": "Grocery / Supermarkets",
      "CLICKS": "Pharmacy / Health & Beauty", "DISCHEM": "Pharmacy / Health & Beauty",
      "MEDIRITE": "Pharmacy / Health & Beauty", "MEDIRITE PLUS": "Pharmacy / Health & Beauty",
      "SPAR PHARMACY": "Pharmacy / Health & Beauty",
      "CHECKERS LIQUORSHOP": "Liquor Stores", "PRESIDENT LIQUOR": "Liquor Stores",
      "SHOPRITE LIQUORSHOP": "Liquor Stores", "TOPS": "Liquor Stores", "PICK N PAY LIQUOR": "Liquor Stores",

      "KIT KAT": "Wholesale / Cash & Carry", "LIQUORSHOP WHOLESALE": "Wholesale / Cash & Carry",
      "SHOPRITE C&C": "Wholesale / Cash & Carry", "UMS": "Wholesale / Cash & Carry",
      "UNITRADE UMS": "Wholesale / Cash & Carry", "SHIELD": "Wholesale / Cash & Carry",
      "ELITE STAR": "Wholesale / Cash & Carry", "SUNSHINE": "Wholesale / Cash & Carry", "ICC": "Wholesale / Cash & Carry",
      "SHOPRITE CANDC": "Wholesale / Cash & Carry", "IBC": "Wholesale / Cash & Carry",
      "BP EXPRESS": "Forecourts"
    };
    const channelTypeOpts = [{ key: "all", label: "All channel types" }].concat(
      Array.from(new Set(Object.values(BANNER_BUCKET))).sort().map(c => ({ key: c, label: c }))
    );
    const channelTypePick = S.channelTypePick || "all";
    const setChannelTypePick = (e) => this.setState({ channelTypePick: e.target.value });
    const chq = (S.chq || "").trim().toLowerCase();
    const chSort = S.chSort || "val";
    const chSorters = {
      val: (a, z) => z.cur_value - a.cur_value,
      vol: (a, z) => z.cur_units - a.cur_units,
      gain: (a, z) => z.delta_value - a.delta_value,
      drop: (a, z) => a.delta_value - z.delta_value,
      growth: (a, z) => (z.value_vs_pct == null ? -9 : z.value_vs_pct) - (a.value_vs_pct == null ? -9 : a.value_vs_pct)
    };
    let chFiltered = rRowsAll.filter(r => !chq || String(r.dim).toLowerCase().indexOf(chq) > -1)
      .filter(r => channelTypePick === "all" || BANNER_BUCKET[String(r.dim).toUpperCase()] === channelTypePick)
      .slice().sort(chSorters[chSort] || chSorters.val);
    const chLimit = S.chLimit || 15;
    const chMax = Math.max(...chFiltered.slice(0, chLimit).map(r => Math.max(r.cur_value, r.ly_value)), 1);
    const retailerRows = chFiltered.slice(0, chLimit).map((r, i) => {

      const sharePp = r.cur_value / rTotCur - r.ly_value / rTotLy;
      const on = S.chPick === r.dim;
      return {
        rank: i + 1, name: this.title(r.dim),
        stores: r.store_count ? this.int(r.store_count) : (storesPerBanner[String(r.dim).toUpperCase()] ? this.int(storesPerBanner[String(r.dim).toUpperCase()]) : "—"),
        value: this.cur(r.cur_value), vVs: this.pct(r.value_vs_pct), vVsColor: this.tone(r.value_vs_pct),
        units: this.num(r.cur_units), uVs: this.pct(r.units_vs_pct), uVsColor: this.tone(r.units_vs_pct),
        price: pc ? "R" + pc.toFixed(2) : "—", pVs: this.pct(pVs), pVsColor: this.tone(pVs),
        delta: this.cur(r.delta_value), deltaColor: this.tone(r.delta_value),
        share: (r.cur_value / rTotCur * 100).toFixed(2) + "%",
        sharePp: (sharePp >= 0 ? "+" : "") + (sharePp * 100).toFixed(2) + "pp", sharePpColor: this.tone(sharePp),
        barCur: (r.cur_value / chMax * 100).toFixed(1) + "%", barLy: (r.ly_value / chMax * 100).toFixed(1) + "%",
        rowBg: on ? "rgba(236,109,37,.10)" : "transparent",
        pick: () => this.setState({ chPick: on ? null : r.dim })
      };
    });
    const retailerCols = [
      { label: "#", align: "left", color: "#4A6B8A" }, { label: "Retailer", align: "left", color: "#4A6B8A" },
      { label: "Stores", align: "right", color: "#4A6B8A" },
      { label: rN + "m value", align: "right", color: "#ec6d25" }, { label: chCmpShort, align: "right", color: "#ec6d25" },
      { label: rN + "m volume", align: "right", color: "#5B9BD5" }, { label: chCmpShort, align: "right", color: "#5B9BD5" },
      { label: "Avg price", align: "right", color: "#8DA2B5" }, { label: chCmpShort, align: "right", color: "#8DA2B5" },

      { label: "Share shift", align: "right", color: "#8DA2B5" }, { label: "This period vs last", align: "left", color: "#4A6B8A" }
    ];
