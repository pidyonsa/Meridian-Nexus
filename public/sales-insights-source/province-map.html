<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Province map</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0a1e39; font-family: 'Poppins', system-ui, sans-serif; overflow: hidden; }
  #map { width: 100%; height: 100%; }
  svg { width: 100%; height: 100%; display: block; }
  .prov { stroke: #0b2140; stroke-width: 1; cursor: pointer; transition: opacity .15s ease; }
  .prov:hover { opacity: .82; }
  .plabel { font-size: 8.5px; font-weight: 600; fill: #f3f7fc; pointer-events: none; paint-order: stroke; stroke: rgba(6,20,38,.75); stroke-width: 2.4px; stroke-linejoin: round; }
  #tip { position: absolute; pointer-events: none; opacity: 0; transition: opacity .12s ease;
         background: #061426; border: 1px solid #1E3A52; border-radius: 8px; padding: 8px 10px;
         box-shadow: 0 10px 24px rgba(0,0,0,.45); color: #f3f7fc; font-size: 11px; min-width: 150px; z-index: 9; }
  #tip .n { font-weight: 700; margin-bottom: 4px; }
  #tip .r { display: flex; gap: 10px; justify-content: space-between; color: #8DA2B5; font-variant-numeric: tabular-nums; }
  #tip .r b { color: #f3f7fc; font-weight: 600; }
</style>
</head>
<body>
<div id="map"></div>
<div id="tip"></div>
<script>
const BANDS = [
  { min:  0.05, fill: "#2FA97C", label: "Above +5%" },
  { min:  0.00, fill: "#5B9BD5", label: "0% to +5%" },
  { min: -0.05, fill: "#3d5f86", label: "-5% to 0%" },
  { min: -0.15, fill: "#E8A838", label: "-15% to -5%" },
  { min: -Infinity, fill: "#D94F3A", label: "Below -15%" }
];
const bandFill = (v) => v == null ? "#1b3557" : (BANDS.find(b => v >= b.min) || BANDS[BANDS.length - 1]).fill;

let data = {}, selected = null, features = null, measure = "value";

function draw() {
  if (!features) return;
  const el = document.getElementById("map");
  const w = el.clientWidth || 520, h = el.clientHeight || 420;
  d3.select("#map").selectAll("svg").remove();
  const svg = d3.select("#map").append("svg").attr("viewBox", "0 0 " + w + " " + h);
  const proj = d3.geoMercator().fitSize([w, h], { type: "FeatureCollection", features });
  const path = d3.geoPath(proj);
  const tip = document.getElementById("tip");

  svg.selectAll("path").data(features).enter().append("path")
    .attr("class", "prov")
    .attr("d", path)
    .attr("fill", f => bandFill((data[f.properties.NAME_1] || {}).vs))
    .attr("stroke", f => selected && selected === f.properties.NAME_1 ? "#ec6d25" : "#0b2140")
    .attr("stroke-width", f => selected && selected === f.properties.NAME_1 ? 2.2 : 1)
    .on("mousemove", (ev, f) => showTip(ev, f))
    .on("mouseleave", () => { tip.style.opacity = 0; })
    .on("click", (ev, f) => {
      const r = data[f.properties.NAME_1];
      if (r) parent.postMessage({ type: "province-click", keys: r.keys }, "*");
    });

  function showTip(ev, f) {
      const r = data[f.properties.NAME_1];
      tip.innerHTML = '<div class="n">' + f.properties.NAME_1 + "</div>" + (r
        ? '<div class="r"><span>12m value</span><b>' + r.value + "</b></div>" +
          '<div class="r"><span>12m volume</span><b>' + r.units + "</b></div>" +
          '<div class="r"><span>' + (measure === "volume" ? "Volume" : "Value") + ' vs LY</span><b style="color:' + (r.vs >= 0 ? "#22C55E" : "#D94F3A") + '">' + r.vsLabel + "</b></div>" +
          '<div class="r"><span>Share of ' + (measure === "volume" ? "volume" : "value") + '</span><b>' + r.share + "</b></div>"
        : '<div class="r"><span>No sales recorded</span></div>');
      tip.style.opacity = 1;
      tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 175) + "px";
      tip.style.top = Math.max(6, ev.clientY - 20) + "px";
  }

  svg.selectAll("text").data(features.filter(f => f.properties.NAME_1.indexOf("isolated") < 0)).enter().append("text")
    .attr("class", "plabel")
    .attr("x", f => path.centroid(f)[0])
    .attr("y", f => path.centroid(f)[1])
    .attr("text-anchor", "middle")
    .text(f => f.properties.NAME_1);
}

fetch("assets/sa-provinces.topo.json").then(r => r.json()).then(topo => {
  const fc = topojson.feature(topo, topo.objects.ZAF_adm1);
  features = fc.features.filter(f => f.properties.NAME_1.indexOf("isolated") < 0);
  draw();
  parent.postMessage({ type: "province-map-ready" }, "*");
});

window.addEventListener("message", (e) => {
  if (!e.data || e.data.type !== "province-data") return;
  data = e.data.rows || {};
  selected = e.data.selected || null;
  measure = e.data.measure || "value";
  draw();
});
window.addEventListener("resize", draw);
</script>
</body>
</html>
