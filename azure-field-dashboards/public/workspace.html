<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081b34">
  <title>Meridian Nexus</title>
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preload" href="/vendor/fonts/poppins-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles/app.css">
  <script type="module" src="/app/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="backdrop" aria-hidden="true"></div>
  <div class="boot" id="boot" role="status" aria-live="polite">
    <img src="/assets/nexus-mark.png" alt="" width="56" height="56">
    <span class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="sr-only">Loading Nexus</span>
  </div>
  <div class="shell" id="shell" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Nexus navigation">
      <a href="/" data-link class="brand" aria-label="Meridian Nexus home">
        <img src="/assets/nexus-mark.png" alt="" width="30" height="30">
        <span>Meridian <b>Nexus</b></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <div class="who"><strong id="userName"></strong><a href="/.auth/logout?post_logout_redirect_uri=/" id="signOut">Sign out</a></div>
        <span class="role-badge" id="userRole"></span>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="workspace">
      <header class="mobilebar">
        <button class="icon-button" id="menuButton" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"></button>
        <a href="/" data-link class="brand compact" aria-label="Meridian Nexus home"><img src="/assets/nexus-mark.png" alt="" width="26" height="26"><span>Meridian <b>Nexus</b></span></a>
        <button class="icon-button" id="mobileSearch" type="button" aria-label="Search Nexus"></button>
      </header>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
  </div>
  <dialog class="palette" id="palette" aria-label="Search Nexus">
    <form method="dialog" class="palette-form">
      <input id="paletteInput" type="search" placeholder="Search tools…" autocomplete="off" aria-controls="paletteResults">
      <ul id="paletteResults" class="palette-results" role="listbox"></ul>
      <footer class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></footer>
    </form>
  </dialog>
  <div class="toast-region" id="toasts" aria-live="polite"></div>
</body>
</html>
