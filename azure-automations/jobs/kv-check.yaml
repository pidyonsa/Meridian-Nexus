# One-off: can id-nexus-georep read a Key Vault secret? Prints HTTP status only, never the value.
location: southafricanorth
identity:
  type: UserAssigned
  userAssignedIdentities:
    /subscriptions/02b268fe-e01a-453e-b287-eec83ccc0676/resourcegroups/rg-meridian-nexus-automations/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-nexus-georep: {}
properties:
  environmentId: /subscriptions/02b268fe-e01a-453e-b287-eec83ccc0676/resourceGroups/rg-meridian-nexus-automations/providers/Microsoft.App/managedEnvironments/cae-nexus-automations
  workloadProfileName: Consumption
  configuration:
    triggerType: Manual
    replicaTimeout: 300
    replicaRetryLimit: 0
    manualTriggerConfig:
      parallelism: 1
      replicaCompletionCount: 1
    registries:
      - server: acrnexusautop2fzlrpwgvno2.azurecr.io
        identity: /subscriptions/02b268fe-e01a-453e-b287-eec83ccc0676/resourcegroups/rg-meridian-nexus-automations/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-nexus-georep
  template:
    containers:
      - name: check
        image: acrnexusautop2fzlrpwgvno2.azurecr.io/tools/node:22-alpine
        resources:
          cpu: 0.25
          memory: 0.5Gi
        env:
          - name: AZURE_CLIENT_ID
            value: c3fbaa7c-edb9-442c-b5ed-b3038d6d29d5
          - name: AUDIENCE
            value: api://95e8953c-64bf-4a17-a65d-e5d531ef7837
          - name: GOOGLE_PROVIDER
            value: //iam.googleapis.com/projects/730011371323/locations/global/workloadIdentityPools/azure-nexus-automations/providers/entra
          - name: GOOGLE_SERVICE_ACCOUNT
            value: nexus-inventory-etl@meridain-nexus.iam.gserviceaccount.com
        command:
          - node
          - -e
          - |
            (async () => {
              const e = process.env;
              const t = await fetch(`${e.IDENTITY_ENDPOINT}?api-version=2019-08-01&resource=${encodeURIComponent('https://vault.azure.net')}&client_id=${e.AZURE_CLIENT_ID}`, { headers: { 'X-IDENTITY-HEADER': e.IDENTITY_HEADER } });
              console.log('KVCHECK token ' + t.status);
              const tok = (await t.json()).access_token;
              const r = await fetch('https://kv-nexusauto-p2fzlrpwgvn.vault.azure.net/secrets/sharepoint-tenant-id?api-version=7.4', { headers: { Authorization: 'Bearer ' + tok } });
              const body = await r.text();
              console.log('KVCHECK secret ' + r.status + ' ' + (r.ok ? 'readable' : body.slice(0, 300)));
            })().catch(err => { console.log('KVCHECK ERROR ' + err.message); process.exit(1); });
